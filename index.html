function makeWallTexture(baseColor,seed){const size=64;const tex=new Uint8ClampedArray(size*size*3);let s=seed;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};const [br,bg,bb]=baseColor;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const brickY=y%16;const offset=((y/16)|0)%2?16:0;const brickX=(x+offset)%32;let r,g,b;
    if(brickY<2||brickX<2){r=br*0.32;g=bg*0.32;b=bb*0.32;}
    else if(brickY<4||brickX<4){r=br*0.68;g=bg*0.68;b=bb*0.68;}
    else if(brickY<6||brickX<6){const n=(rnd()-0.5)*20;r=clamp(br*1.18+n,0,255);g=clamp(bg*1.18+n,0,255);b=clamp(bb*1.18+n,0,255);}
    else{const n=(rnd()-0.5)*55;r=clamp(br+n,0,255);g=clamp(bg+n,0,255);b=clamp(bb+n,0,255);if(rnd()<0.08){r*=0.75;g*=0.75;b*=0.75;}}
    const i=(y*size+x)*3;tex[i]=r;tex[i+1]=g;tex[i+2]=b;}
  return {data:tex,size};}

let audioCtx=null,masterVolume=0.7,musicVolume=0.5;
let musicSource=null,currentTrackLoopTimer=null,currentTrackKey=null;
(function(){try{const v=parseFloat(localStorage.getItem(STORAGE_VOLUME));if(!isNaN(v))masterVolume=clamp(v,0,1);const mv=parseFloat(localStorage.getItem(STORAGE_MUSIC_VOLUME));if(!isNaN(mv))musicVolume=clamp(mv,0,1);}catch(e){}})();
function saveVolumes(){try{localStorage.setItem(STORAGE_VOLUME,String(masterVolume));localStorage.setItem(STORAGE_MUSIC_VOLUME,String(musicVolume));}catch(e){}}
function ensureAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){audioCtx=null;}}}
function playTone(type,f1,f2,dur,vol){if(!audioCtx||masterVolume<=0)return;const now=audioCtx.currentTime;const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(f1,now);osc.frequency.exponentialRampToValueAtTime(Math.max(1,f2),now+dur);gain.gain.setValueAtTime(vol*masterVolume,now);gain.gain.exponentialRampToValueAtTime(0.001,now+dur);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+dur);}
function playShot(k){playTone("square",k==="shotgun"?180:320,40,k==="shotgun"?0.18:0.09,0.14);}
function playHit(){playTone("sawtooth",600,80,0.25,0.18);}
function playPickup(){playTone("sine",600,1200,0.1,0.12);}
function playBossRoar(){playTone("sawtooth",60,100,0.7,0.25);}
function playHellBossRoar(){playTone("sawtooth",40,80,1.2,0.35);}
function startSynthTrack(key){const t=TRACKS[key];if(!t)return;const s=t.synth;const type=s.type,base=s.base,interval=s.tempo,wave=s.wave;const note=()=>{if(!audioCtx||musicVolume<=0)return;const now=audioCtx.currentTime;const dur=interval*0.9;const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type=wave;let freq=base;const p=Math.random();if(type==="ambient")freq=base+(p<0.5?0:3);else if(type==="march")freq=base+(p<0.3?0:(p<0.6?5:7));else if(type==="dream")freq=base+(p<0.4?0:(p<0.7?4:-3));else if(type==="industrial")freq=base+Math.floor(p*12);else if(type==="synthwave")freq=base+(p<0.3?0:(p<0.7?4:9));else if(type==="techno")freq=base+Math.floor(p*6)*2;osc.frequency.setValueAtTime(freq,now);osc.frequency.linearRampToValueAtTime(freq*0.98,now+dur);gain.gain.setValueAtTime(0.06*musicVolume,now);gain.gain.exponentialRampToValueAtTime(0.001,now+dur);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+dur);};note();currentTrackLoopTimer=setInterval(note,interval*1000);}
function stopMusic(){if(currentTrackLoopTimer){clearInterval(currentTrackLoopTimer);currentTrackLoopTimer=null;}if(musicSource){try{musicSource.pause();musicSource.currentTime=0;}catch(e){}musicSource=null;}}
function playTrackByKey(key,forceRestart){ensureAudio();if(!forceRestart&&currentTrackKey===key&&(musicSource||currentTrackLoopTimer))return;stopMusic();currentTrackKey=key;const t=TRACKS[key];if(!t)return;if(!t.file){startSynthTrack(key);return;}const audio=new Audio();audio.src=t.file;audio.loop=true;audio.volume=musicVolume*masterVolume;let failed=false;audio.onerror=()=>{if(!failed){failed=true;startSynthTrack(key);}};audio.play().then(()=>{musicSource=audio;}).catch(()=>{if(!failed){failed=true;startSynthTrack(key);}});}

    boss={x:bx,y:by,hp:bossHp,maxHp:bossHp,timer:1.5,alive:true,isBoss:isBossLevel,isHellBoss:isHellBossLevel,isCircleBoss:isCircleBoss,circle:currentCircle,size:bossSize};
    enemies.push(boss);

    pickups.push({x:w/2,y:3.5,kind:"medkit"});pickups.push({x:w/2,y:h-3.5,kind:"medkit"});
    pickups.push({x:3.5,y:h/2,kind:"ammo"});pickups.push({x:w-3.5,y:h/2,kind:"ammo"});
    pickups.push({x:6.5,y:6.5,kind:"ammo"});pickups.push({x:w-6.5,y:6.5,kind:"ammo"});
    pickups.push({x:6.5,y:h-6.5,kind:"ammo"});pickups.push({x:w-6.5,y:h-6.5,kind:"ammo"});

  }else{
    const free=[];

    shuffle(free);const n=Math.min(6+idx,Math.floor(free.length/4));
    for(let i=0;i<n;i++){
      if(page===3){const st=circleStats(currentCircle);enemies.push({x:free[i].x,y:free[i].y,hp:st.enemyHp,timer:1.1,alive:true,size:1.3,isHellDemon:true,dmgMin:st.enemyDmgMin,dmgMax:st.enemyDmgMax,circle:currentCircle});}
      else if(page===2)enemies.push({x:free[i].x,y:free[i].y,hp:80,timer:1.2,alive:true,size:1.3,isDemon:true,dmgMin:20,dmgMax:28});

function isWall(x,y){if(x<0||y<0||y>=grid.length||x>=grid[0].length)return true;return grid[y|0][x|0]!==0;}
function hasLineOfSight(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;const d=Math.hypot(dx,dy);if(d<0.001)return true;const s=Math.ceil(d/0.05);for(let i=1;i<s;i++){const t=i/s;if(isWall(x1+dx*t,y1+dy*t))return false;}return true;}
function tryMove(dx,dy){const nx=player.x+dx,ny=player.y+dy;if(!isWall(nx,player.y))player.x=nx;if(!isWall(player.x,ny))player.y=ny;}
function takeDamage(dmg,sx,sy){player.hp-=dmg;const a=Math.atan2(sy-player.y,sx-player.x);let r=a-player.angle;r=((r+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;player.damageIndicators.push({rel:r,t:DAMAGE_INDICATOR_LIFETIME});}
function spawnMinions(isHell,isCircle){const h=grid.length,w=grid[0].length;const ps=[{x:3.5,y:3.5},{x:w-3.5,y:3.5},{x:3.5,y:h-3.5},{x:w-3.5,y:h-3.5},{x:w/2,y:3.5},{x:w/2,y:h-3.5}];const c=Math.min(2+bossWaveNum,isHell||isCircle?8:6);const sh=ps.slice().sort(()=>Math.random()-0.5);for(let i=0;i<c;i++){const p=sh[i%sh.length];let hp=30,dmgMin=5,dmgMax=12;if(isHell){hp=60;dmgMin=15;dmgMax=22;}if(isCircle){const st=circleStats(currentCircle);hp=Math.floor(st.enemyHp*0.5);dmgMin=st.enemyDmgMin;dmgMax=st.enemyDmgMax;}enemies.push({x:p.x,y:p.y,hp:hp,timer:1.2,alive:true,size:1.0,minion:true,dmgMin:dmgMin,dmgMax:dmgMax});}}
function updateEnemies(dt){
  for(const e of enemies){if(!e.alive)continue;const dx=player.x-e.x,dy=player.y-e.y;const d=Math.hypot(dx,dy);if(d<0.01)continue;const vis=hasLineOfSight(e.x,e.y,player.x,player.y);
    if(e.isBoss||e.isHellBoss||e.isCircleBoss){
      const isHell=e.isHellBoss;const isCirc=e.isCircleBoss;
      if(d>1.5&&d<(isCirc?16:isHell?14:12)){
        const sp=isCirc?1.2:isHell?1.1:0.8;
        const nx=e.x+(dx/d)*sp*dt,ny=e.y+(dy/d)*sp*dt;
        if(!isWall(ny,e.x))e.y=ny;
        if(!isWall(e.x,nx))e.x=nx;
      }
      e.timer-=dt;
      // Боссы стреляют ТОЛЬКО при прямой видимости (vis) и реже
      if(vis&&d<(isCirc?18:isHell?16:14)&&e.timer<=0){
        e.timer=isCirc?1.1:isHell?0.9:1.2;
        const sh=isCirc?3:isHell?3:2;
        const dmMin=isCirc?circleStats(e.circle).bossDmgMin:isHell?12:8;
        const dmMax=isCirc?circleStats(e.circle).bossDmgMax:isHell?20:14;
        for(let k=0;k<sh;k++)if(Math.random()<0.75)takeDamage(dmMin+Math.floor(Math.random()*(dmMax-dmMin+1)),e.x,e.y);
      }
    }
    else if(e.isHellDemon){if(d>0.9){const sp=2.6;const nx=e.x+(dx/d)*sp*dt,ny=e.y+(dy/d)*sp*dt;if(!isWall(ny,e.x))e.y=ny;if(!isWall(e.x,nx))e.x=nx;}e.timer-=dt;if(vis&&d<1.4&&e.timer<=0){e.timer=0.7;if(Math.random()<0.9){const mn=e.dmgMin||30;const mx=e.dmgMax||40;takeDamage(mn+Math.floor(Math.random()*(mx-mn+1)),e.x,e.y);playHit();}}}
    else if(e.isDemon){if(d>0.9){const sp=2.2;const nx=e.x+(dx/d)*sp*dt,ny=e.y+(dy/d)*sp*dt;if(!isWall(ny,e.x))e.y=ny;if(!isWall(e.x,nx))e.x=nx;}e.timer-=dt;if(vis&&d<1.4&&e.timer<=0){e.timer=0.8;if(Math.random()<0.85){const mn=e.dmgMin||20;const mx=e.dmgMax||28;takeDamage(mn+Math.floor(Math.random()*(mx-mn+1)),e.x,e.y);playHit();}}}
    else{if(vis&&d>1.0&&d<8){const nx=e.x+(dx/d)*1.2*dt,ny=e.y+(dy/d)*1.2*dt;if(!isWall(ny,e.x))e.y=ny;if(!isWall(e.x,nx))e.x=nx;}e.timer-=dt;if(vis&&d<6&&e.timer<=0){e.timer=0.9;if(Math.random()<0.6)takeDamage(Math.floor(5+Math.random()*8),e.x,e.y);}}
  }
  if((isBossLevel||isHellBossLevel||isCircleBoss)&&boss&&boss.alive){bossWaveTimer-=dt;const am=enemies.filter(e=>e.alive&&e.minion).length;if(bossWaveTimer<=0&&am<2){bossWaveNum+=1;bossWaveTimer=6;spawnMinions(isHellBossLevel,isCircleBoss);}}
}
function updateDamageIndicators(dt){for(const i of player.damageIndicators)i.t-=dt;player.damageIndicators=player.damageIndicators.filter(i=>i.t>0);}
function shoot(){if(player.ammo<=0)return;player.ammo-=1;player.anim=1;player.flash=1;playShot(player.weapon);const cone=aiming?0.04:0.08,dm=aiming?1.5:1;let best=null,bd=1e9;for(const e of enemies){if(!e.alive)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.hypot(dx,dy);let a=Math.atan2(dy,dx)-player.angle;a=((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;const hr=(e.isBoss||e.isHellBoss||e.isCircleBoss)?0.12:(e.isDemon||e.isHellDemon)?0.10:0.08;if(Math.abs(a)<hr+cone&&d<12&&d<bd){if(hasLineOfSight(player.x,player.y,e.x,e.y)){best=e;bd=d;}}}if(best){const base=player.weapon==="pistol"?25:60;best.hp-=base*dm;if(best.hp<=0){best.alive=false;player.score+=best.isCircleBoss?8000:best.isHellBoss?10000:best.isBoss?5000:best.isHellDemon?400:best.isDemon?250:100;playHit();}}}

function renderWalls(){const gh=grid.length,gw=grid[0].length;const sa=player.angle-HALF_FOV,step=FOV/(RAYS-1);let cc="#1e1e28",fc="#3c3228";if(isBossLevel){cc="#1a0a0a";fc="#2a1010";}else if(isHellBossLevel||isCircleBoss){cc="#200000";fc="#400000";}else if(isPage3){const col=HELL_CIRCLE_COLORS[currentCircle];cc="rgb("+col.ceil.join(",")+")";fc="rgb("+col.floor.join(",")+")";}else if(isPage2){cc="#160a1a";fc="#2a1030";}ctx.fillStyle=cc;ctx.fillRect(0,0,VW,VH/2);ctx.fillStyle=fc;ctx.fillRect(0,VH/2,VW,VH/2);const colW=Math.ceil(VW/RAYS)+1;
  for(let i=0;i<RAYS;i++){const ang=sa+step*i;const ca=Math.cos(ang),sana=Math.sin(ang);let hit=false;for(let d=0.05;d<MAX_DEPTH;d+=0.02){const tx=player.x+ca*d,ty=player.y+sana*d;if(tx<0||ty<0||tx>=gw||ty>=gh)break;const cell=grid[ty|0][tx|0];if(cell===0)continue;const dd=d*Math.cos(ang-player.angle);const dep=Math.max(dd,0.001);const colH=Math.min(VH/dep,VH*3);const y0=(VH>>1)-colH/2;let tex;if(cell===2)tex=TEX_EXIT;else if(isPage3)tex=TEX_CIRCLE[currentCircle];else if(isHellBossLevel||isCircleBoss)tex=TEX_HELL_WALL;else if(isBossLevel)tex=TEX_BOSS_WALL;else if(isPage2)tex=TEX_DEMON_WALL;else tex=TEX_WALL;const fx=tx-Math.floor(tx),fy=ty-Math.floor(ty);let txX;if(Math.min(fx,1-fx)<Math.min(fy,1-fy))txX=ca<0?(fx*64)|0:((1-fx)*64)|0;else txX=sana<0?(fy*64)|0:((1-fy)*64)|0;txX=clamp(txX,0,63);const shade=Math.max(0.25,1-dep/MAX_DEPTH);drawTexturedColumn(i*(VW/RAYS),Math.max(0,y0),colW,colH,tex,txX,shade);zbuffer[i]=dep;hit=true;break;}if(!hit)zbuffer[i]=MAX_DEPTH;}}
function drawTexturedColumn(x,y,w,h,tex,txX,shade){let dY=y,dH=h,sY0=0,sY1=tex.size;if(dY<0){const cut=-dY;sY0=(cut/h)*tex.size;dH-=cut;dY=0;}if(dY+dH>VH){const cut=dY+dH-VH;sY1=tex.size-(cut/h)*tex.size;dH-=cut;}if(dH<=0)return;const strip=getStrip(tex,txX);ctx.drawImage(strip,0,sY0,1,Math.max(1,sY1-sY0),x,dY,w,dH);if(shade<1){ctx.fillStyle="rgba(0,0,0,"+(1-shade)+")";ctx.fillRect(x,dY,w,dH);}}
const stripCache=new WeakMap();

function renderSprites(){const list=[];for(const e of enemies){if(!e.alive)continue;let spr;if(e.isCircleBoss)spr=SPR_CIRCLE_BOSS[e.circle];else if(e.isHellBoss)spr=SPR_HELL_BOSS;else if(e.isBoss)spr=SPR_BOSS;else if(e.isHellDemon)spr=SPR_DEMON;else if(e.isDemon)spr=SPR_DEMON;else spr=SPR_ENEMY;list.push({x:e.x,y:e.y,spr:spr,size:e.size||1.0});}for(const p of pickups)list.push({x:p.x,y:p.y,spr:p.kind==="medkit"?SPR_MEDKIT:SPR_AMMO,size:1.0});list.sort((a,b)=>{const da=Math.hypot(a.x-player.x,a.y-player.y),db=Math.hypot(b.x-player.x,b.y-player.y);return db-da;});for(const s of list){const dx=s.x-player.x,dy=s.y-player.y;const d=Math.hypot(dx,dy);if(d<0.3)continue;let a=Math.atan2(dy,dx)-player.angle;a=((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;if(Math.abs(a)>HALF_FOV+0.3)continue;const sx=(0.5+a/FOV)*VW;const size=Math.min(VH/d,VH*2)*(s.size||1);const col=clamp(Math.floor(sx/VW*RAYS),0,RAYS-1);if(d>zbuffer[col])continue;const y=VH/2+size/4-size/2;ctx.drawImage(s.spr,sx-size/2,y,size,size);}}
function renderWeapon(){const spr=player.weapon==="pistol"?SPR_PISTOL:SPR_SHOTGUN;const w=spr.width,h=spr.height;let cy;if(aiming)cy=VH-h/2-30;else cy=VH-h/2+90+player.anim*40;const cx=VW/2;if(player.flash>0){ctx.save();ctx.globalAlpha=0.5*player.flash;ctx.globalCompositeOperation="lighter";ctx.fillStyle="rgb(255,220,100)";ctx.fillRect(cx-w/2,cy-h/2,w,h);ctx.restore();}ctx.drawImage(spr,cx-w/2,cy-h/2);}
function renderCrosshair(){const cx=VW/2,cy=VH/2;const gap=aiming?6:10;const len=aiming?10:8;ctx.strokeStyle=aiming?"#00ff50":"#e6e6e6";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-gap-len,cy);ctx.lineTo(cx-gap,cy);ctx.moveTo(cx+gap,cy);ctx.lineTo(cx+gap+len,cy);ctx.moveTo(cx,cy-gap-len);ctx.lineTo(cx,cy-gap);ctx.moveTo(cx,cy+gap);ctx.lineTo(cx,cy+gap+len);ctx.stroke();ctx.fillStyle=aiming?"#00ff50":"#e6e6e6";ctx.beginPath();ctx.arc(cx,cy,1.5,0,7);ctx.fill();}

function update(dt){

    if(!gameOver&&!win){
      const sp=(aiming?1.5:3.0)*dt;let dx=0,dy=0;
      if(keys["w"]||keys["ц"]){dx+=Math.cos(player.angle)*sp;dy+=Math.sin(player.angle)*sp;}
      if(keys["s"]||keys["ы"]){dx-=Math.cos(player.angle)*sp;dy-=Math.sin(player.angle)*sp;}
      if(keys["a"]||keys["ф"]){dx+=Math.cos(player.angle-Math.PI/2)*sp;dy+=Math.sin(player.angle-Math.PI/2)*sp;}
      if(keys["d"]||keys["в"]){dx+=Math.cos(player.angle+Math.PI/2)*sp;dy+=Math.sin(player.angle+Math.PI/2)*sp;}
      if(touch.moveTouchId!==null){const speed=(aiming?1.5:3.0)*dt*1.2;const forward=-touch.moveDY;const strafe=touch.moveDX;dx+=(Math.cos(player.angle)*forward-Math.sin(player.angle)*strafe)*speed;dy+=(Math.sin(player.angle)*forward+Math.cos(player.angle)*strafe)*speed;}
      tryMove(dx,dy);
      if(document.pointerLockElement===canvas&&mouseDX!==0){const sens=aiming?0.0012:0.0025;player.angle+=mouseDX*sens;mouseDX=0;}else mouseDX=0;
      player.angle=((player.angle+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
      updateEnemies(dt);
      for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];if(Math.hypot(p.x-player.x,p.y-player.y)<0.5){if(p.kind==="medkit")player.hp=Math.min(100,player.hp+25);else player.ammo+=20;pickups.splice(i,1);playPickup();}}
      player.anim=Math.max(0,player.anim-dt*4);player.flash=Math.max(0,player.flash-dt*8);updateDamageIndicators(dt);
      if(isBossLevel||isHellBossLevel||isCircleBoss){if(boss&&!boss.alive)win=true;}else{if(exitPos&&Math.hypot(exitPos.x-player.x,exitPos.y-player.y)<0.6)win=true;}

  }else if(state===GAME_STATE.MENU){updateMenuButtons(dt);}
}

  if(mx>=30&&mx<=210&&my>=VH-70&&my<=VH-25){state=GAME_STATE.MENU;menuTime=0;rebuildMenuButtons();}
  }else if(state===GAME_STATE.RENAME){const w=600,h=240;const x=(VW-w)/2,y=(VH-h)/2;const saveX=x+30,saveY=y+h-60,bw=200,bh=45;const cancelX=x+w-230;
    if(mx>=saveX&&mx<=saveX+bw&&my>=saveY&&my<=saveY+bh){const name=(renameBuffer.trim()||("Игрок "+(renameSlotIdx+1))).slice(0,20);slots[renameSlotIdx].name=name;saveSlots();state=GAME_STATE.SLOTS;rebuildSlotButtons();}
    else if(mx>=cancelX&&mx<=cancelX+bw&&my>=saveY&&my<=saveY+bh){state=GAME_STATE.SLOTS;rebuildSlotButtons();}
  }else if(state===GAME_STATE.LEVELS){
    if(mx>=30&&mx<=210&&my>=VH-70&&my<=VH-25){state=GAME_STATE.MENU;menuTime=0;rebuildMenuButtons();return;}
    const tabW=220,tabH=36;const tx1=VW/2-tabW*1.5-20,tx2=VW/2-tabW/2,tx3=VW/2+tabW/2+20;const ty=80;const slot=getSlot();
    if(mx>=tx1&&mx<=tx1+tabW&&my>=ty&&my<=ty+tabH){currentPage=1;levelScroll=0;rebuildLevelButtons();return;}
    if(mx>=tx2&&mx<=tx2+tabW&&my>=ty&&my<=ty+tabH){if(slot.bossDefeated){currentPage=2;levelScroll=0;rebuildLevelButtons();}return;}
    if(mx>=tx3&&mx<=tx3+tabW&&my>=ty&&my<=ty+tabH){if(slot.hellBossDefeated){currentPage=3;levelScroll=0;rebuildLevelButtons();}return;}
    if(currentPage===3){const c3=slot.unlockedPage3||[1,0,0,0,0,0,0];const circW=110,circH=34,gap=8;const ty2=130;const startX=VW/2-(7*circW+6*gap)/2;for(let c=0;c<7;c++){const x=startX+c*(circW+gap);if(mx>=x&&mx<=x+circW&&my>=ty2&&my<=ty2+circH){if(c3[c]>0){currentCircle=c;levelScroll=0;rebuildLevelButtons();}return;}}}
    const topMargin=currentPage===3?240:195,bottomMargin=90;if(my<topMargin-5||my>VH-bottomMargin+5)return;
    for(const b of levelButtons){const vy=b.y-levelScroll;if(mx>=b.x&&mx<=b.x+b.w&&my>=vy&&my<=vy+b.h){if(b.enabled){levelIdx=b.idx;loadLevel(levelIdx,b.page,b.circle);state=GAME_STATE.PLAYING;if(!isTouchDevice)setTimeout(()=>canvas.requestPointerLock(),50);}return;}}
  }else if(state===GAME_STATE.SHOP){
    const tabW=220,tabH=40;const tx1=VW/2-tabW*1.5-20,tx2=VW/2-tabW/2,tx3=VW/2+tabW/2+20;const ty=115;
    if(mx>=tx1&&mx<=tx1+tabW&&my>=ty&&my<=ty+tabH){shopTab="menu";rebuildShopButtons();return;}
    if(mx>=tx2&&mx<=tx2+tabW&&my>=ty&&my<=ty+tabH){shopTab="cursor";rebuildShopButtons();return;}
    if(mx>=tx3&&mx<=tx3+tabW&&my>=ty&&my<=ty+tabH){shopTab="music";rebuildShopButtons();return;}
    for(const b of shopButtons){if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){
      const item=b.kind==="music"?TRACKS[b.key]:THEMES[b.kind][b.key];const slot=getSlot();
      if(b.kind==="music"){const owned=slot.ownedTracks.includes(b.key);if(owned){const im=slot.musicMenu===b.key,ig=slot.musicGame===b.key;if(im&&ig){slot.musicMenu="default";slot.musicGame="default";}else if(im){slot.musicMenu="default";slot.musicGame=b.key;}else if(ig){slot.musicMenu=b.key;slot.musicGame="default";}else{slot.musicMenu=b.key;slot.musicGame=b.key;}saveSlots();playTrackByKey(slot.musicMenu||"default",true);}else if(slot.runes>=item.price){slot.runes-=item.price;slot.ownedTracks.push(b.key);slot.musicMenu=b.key;slot.musicGame=b.key;saveSlots();playTrackByKey(b.key,true);}}
      else{const arr=b.kind==="menu"?slot.ownedMenuThemes:slot.ownedCursorThemes;if(arr.includes(b.key)){if(b.kind==="menu")slot.menuTheme=b.key;else slot.cursorTheme=b.key;saveSlots();}else if(slot.runes>=item.price){slot.runes-=item.price;arr.push(b.key);if(b.kind==="menu")slot.menuTheme=b.key;else slot.cursorTheme=b.key;saveSlots();}}
      return;
    }}
    if(mx>=30&&mx<=210&&my>=VH-70&&my<=VH-25){state=GAME_STATE.MENU;menuTime=0;rebuildMenuButtons();}
  }else if(state===GAME_STATE.SETTINGS){if(mx>=30&&mx<=210&&my>=VH-70&&my<=VH-25){state=GAME_STATE.MENU;menuTime=0;rebuildMenuButtons();}}
  else if(state===GAME_STATE.CONFIRM_RESET){const w=600,h=240;const x=(VW-w)/2,y=(VH-h)/2;const yesX=x+40,noX=x+w-260,by=y+h-70,bw=220,bh=50;if(mx>=yesX&&mx<=yesX+bw&&my>=by&&my<=by+bh){if(confirmCallback)confirmCallback();confirmCallback=null;}else if(mx>=noX&&mx<=noX+bw&&my>=by&&my<=by+bh){confirmCallback=null;state=GAME_STATE.SLOTS;rebuildSlotButtons();}}
}
function doMenuAction(action){
  if(action==="play"){const s=getSlot();const c3=s.unlockedPage3||[1,0,0,0,0,0,0];let lastCircle=-1;for(let c=6;c>=0;c--){if(c3[c]>0){lastCircle=c;break;}}
    if(lastCircle>=0&&c3[lastCircle]>0&&c3[lastCircle]<=11){currentPage=3;currentCircle=lastCircle;levelIdx=Math.max(0,Math.min(c3[lastCircle]-1,10));loadLevel(levelIdx,3,currentCircle);}
    else if(s.hellBossDefeated){currentPage=3;currentCircle=0;levelIdx=0;loadLevel(0,3,0);}
    else if(s.bossDefeated&&s.unlockedPage2>0){currentPage=2;levelIdx=Math.max(0,s.unlockedPage2-1);loadLevel(levelIdx,2);}
    else{currentPage=1;levelIdx=Math.max(0,Math.min(s.unlocked-1,PAGE1_RAW.length));loadLevel(levelIdx,1);}
    state=GAME_STATE.PLAYING;if(!isTouchDevice)setTimeout(()=>canvas.requestPointerLock(),50);
  }else if(action==="levels"){state=GAME_STATE.LEVELS;levelScroll=0;currentPage=1;rebuildLevelButtons();}
  else if(action==="slots"){state=GAME_STATE.SLOTS;rebuildSlotButtons();}
  else if(action==="shop"){state=GAME_STATE.SHOP;shopTab="menu";rebuildShopButtons();}
  else if(action==="settings"){settingsVolume=masterVolume;settingsMusicVolume=musicVolume;state=GAME_STATE.SETTINGS;}
  else if(action==="quit"){document.body.innerHTML="<div style='color:#fff;font-family:Consolas;padding:40px;font-size:20px'>Спасибо за игру!<br><br>Обновите страницу, чтобы вернуться.</div>";}
}
function exitToMenu(){if(document.exitPointerLock)document.exitPointerLock();aiming=false;touch.moveTouchId=null;touch.lookTouchId=null;touch.moveDX=0;touch.moveDY=0;state=GAME_STATE.MENU;menuTime=0;rebuildMenuButtons();playTrackByKey(getSlot().musicMenu||"default",true);}
</script>
