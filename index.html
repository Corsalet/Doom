function resizeCanvas() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  // виртуальные пропорции 960x600, вписываем в окно
  const aspect = VW / VH;
  let cw = w, ch = h;

  else ch = w / aspect;
  canvas.width = VW;
  canvas.height = VH;
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
}

function makeWallTexture(baseColor, seed) {
  const size = 64;
  const tex = new Uint8ClampedArray(size * size * 3);
  let s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const [br, bg, bb] = baseColor;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const brickY = y % 16;
      const offset = ((y / 16) | 0) % 2 ? 16 : 0;
      const brickX = (x + offset) % 32;
      let r, g, b;
      if (brickY < 2 || brickX < 2) {
        r = br * 0.5; g = bg * 0.5; b = bb * 0.5;
      } else {
        const n = (rnd() - 0.5) * 40;
        r = clamp(br + n, 0, 255);
        g = clamp(bg + n, 0, 255);
        b = clamp(bb + n, 0, 255);
      }
      const i = (y * size + x) * 3;
      tex[i] = r; tex[i + 1] = g; tex[i + 2] = b;
    }
  }
  return { data: tex, size };
}

function clamp(v, min, max) { return v < min ? min : v > max ? max : v; }

  g.lineTo(340, 100); g.lineTo(334, 100); g.closePath(); g.fill();
  g.fillStyle = "#f0f0f0"; g.beginPath(); g.arc(337, 94, 3, 0, 7); g.fill();
  g.fillStyle = "#1e1e1e"; g.beginPath(); g.arc(337, 94, 1, 0, 7); g.fill();
  g.strokeStyle = "#373a41"; g.lineWidth = 6;
  g.beginPath(); g.arc(170, 182, 26, 3.3, 6.1); g.stroke();
  g.strokeStyle = "#1e2026"; g.lineWidth = 5;
  g.beginPath(); g.moveTo(168, 165); g.lineTo(170, 190); g.stroke();
  g.strokeStyle = "#191a1e"; g.lineWidth = 2;
  g.strokeRect(75, 110, 130, 45);
  g.strokeRect(200, 100, 150, 22);
  g.strokeRect(200, 122, 150, 20);
  return c;
}

const SPR_PISTOL = makePistol();
const SPR_SHOTGUN = makeShotgun();

// ============================================================
// ЗВУК (Web Audio — генерируем при выстреле)
// ============================================================
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
}
function playShot(kind) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const dur = kind === "shotgun" ? 0.18 : 0.09;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(kind === "shotgun" ? 180 : 320, now);
  osc.frequency.exponentialRampToValueAtTime(40, now + dur);
  gain.gain.setValueAtTime(0.14, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now); osc.stop(now + dur);
}
function playHit() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(600, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
  gain.gain.setValueAtTime(0.18, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.25);
}
function playPickup() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(600, now);
  osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.12);
}

// ============================================================
// ПРОГРЕСС
// ============================================================
function loadProgress() {
  try {
    const v = parseInt(localStorage.getItem(STORAGE_KEY) || "1");
    return isNaN(v) ? 1 : clamp(v, 1, LEVELS_RAW.length);
  } catch (e) { return 1; }
}
function saveProgress(v) {
  try { localStorage.setItem(STORAGE_KEY, String(v)); } catch (e) {}
}
function resetProgress() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  return 1;
}

// ============================================================
// СОСТОЯНИЕ ИГРЫ
// ============================================================
const GAME_STATE = {
  MENU: "menu",
  LEVELS: "levels",
  SETTINGS: "settings",
  PLAYING: "playing",
  CONFIRM_RESET: "confirm"
};

let state = GAME_STATE.MENU;
let unlocked = loadProgress();

let player = null;
let grid = null;
let enemies = [];
let pickups = [];
let exitPos = null;
let zbuffer = new Float32Array(RAYS);
let levelIdx = 0;

let gameOver = false;
let win = false;
let menuTime = 0;
let lastTime = 0;
let aiming = false;
let mouseDX = 0;

// тач-управление
const touch = {
  active: false,           // включено ли тач-управление (когда есть касания)
  moveTouchId: null,
  moveStartX: 0, moveStartY: 0,
  moveDX: 0, moveDY: 0,
  lookTouchId: null,
  lookLastX: 0,
  fireHeld: false
};
let isTouchDevice = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;

// ============================================================
// ЗАГРУЗКА УРОВНЯ
// ============================================================
function loadLevel(idx) {
  const raw = LEVELS_RAW[idx];
  const h = raw.length, w = raw[0].length;
  grid = [];
  exitPos = null;
  for (let y = 0; y < h; y++) {
    const row = new Int8Array(w);
    for (let x = 0; x < w; x++) {
      const ch = raw[y][x];
      row[x] = ch === "1" ? 1 : ch === "2" ? 2 : 0;
      if (ch === "2") exitPos = { x: x + 0.5, y: y + 0.5 };
    }
    grid.push(row);
  }
  // свободные клетки
  const free = [];
  for (let y = 1; y < h - 1; y++)
    for (let x = 1; x < w - 1; x++)
      if (grid[y][x] === 0 && !(x === 1 && y === 1))
        free.push({ x: x + 0.5, y: y + 0.5 });
  shuffle(free);
  const n = Math.min(6 + idx, Math.floor(free.length / 4));
  enemies = [];
  for (let i = 0; i < n; i++) {
    enemies.push({
      x: free[i].x, y: free[i].y, hp: 30,
      timer: 1.0, alive: true
    });
  }
  pickups = [];
  for (let i = n; i < Math.min(n + 5, free.length); i++) {
    pickups.push({
      x: free[i].x, y: free[i].y,
      kind: i % 2 === 0 ? "medkit" : "ammo"
    });
  }
  player = {
    x: 1.5, y: 1.5, angle: 0,
    hp: 100, ammo: 50, score: 0,
    weapon: "pistol",
    anim: 0, flash: 0,
    damageIndicators: []
  };
  gameOver = false;
  win = false;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
}

// ============================================================
// ЛОГИКА ИГРЫ
// ============================================================
function isWall(x, y) {
  if (x < 0 || y < 0 || y >= grid.length || x >= grid[0].length) return true;
  return grid[y | 0][x | 0] !== 0;
}

function hasLineOfSight(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx, dy);
  if (dist < 0.001) return true;
  const steps = Math.ceil(dist / 0.05);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = x1 + dx * t;
    const y = y1 + dy * t;
    if (isWall(x, y)) return false;
  }
  return true;
}

function tryMove(dx, dy) {
  const nx = player.x + dx;
  const ny = player.y + dy;
  if (!isWall(nx, player.y)) player.x = nx;
  if (!isWall(player.x, ny)) player.y = ny;
}

function takeDamage(dmg, sx, sy) {
  player.hp -= dmg;
  const angToSrc = Math.atan2(sy - player.y, sx - player.x);
  let rel = angToSrc - player.angle;
  rel = ((rel + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  player.damageIndicators.push({ rel, t: DAMAGE_INDICATOR_LIFETIME });
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.01) continue;
    const visible = hasLineOfSight(e.x, e.y, player.x, player.y);
    if (visible && dist > 1.0 && dist < 8) {
      const nx = e.x + (dx / dist) * 1.2 * dt;
      const ny = e.y + (dy / dist) * 1.2 * dt;
      if (!isWall(ny, e.x)) e.y = ny;
      if (!isWall(e.x, nx)) e.x = nx;
    }
    e.timer -= dt;
    if (visible && dist < 6 && e.timer <= 0) {
      e.timer = 0.9;
      if (Math.random() < 0.6) takeDamage(Math.floor(5 + Math.random() * 8), e.x, e.y);
    }
  }
}

function updateDamageIndicators(dt) {
  for (const ind of player.damageIndicators) ind.t -= dt;
  player.damageIndicators = player.damageIndicators.filter(i => i.t > 0);
}

function shoot() {
  if (player.ammo <= 0) return;
  player.ammo -= 1;
  player.anim = 1.0;
  player.flash = 1.0;
  playShot(player.weapon);
  const cone = aiming ? 0.04 : 0.08;
  const dmgMul = aiming ? 1.5 : 1.0;
  let best = null, bestD = 1e9;
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.x - player.x, dy = e.y - player.y;
    const dist = Math.hypot(dx, dy);
    let ang = Math.atan2(dy, dx) - player.angle;
    ang = ((ang + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    if (Math.abs(ang) < cone && dist < 12 && dist < bestD) {
      if (hasLineOfSight(player.x, player.y, e.x, e.y)) {
        best = e; bestD = dist;
      }
    }
  }
  if (best) {
    const base = player.weapon === "pistol" ? 25 : 60;
    best.hp -= base * dmgMul;
    if (best.hp <= 0) {
      best.alive = false;
      player.score += 100;
      playHit();
    }
  }
}

// ============================================================
// РЕНДЕР 3D
// ============================================================
function renderWalls() {
  const gh = grid.length, gw = grid[0].length;
  const startAng = player.angle - HALF_FOV;
  const stepAng = FOV / (RAYS - 1);

  // потолок и пол — заливаем фонами
  ctx.fillStyle = "#1e1e28";
  ctx.fillRect(0, 0, VW, VH / 2);
  ctx.fillStyle = "#3c3228";
  ctx.fillRect(0, VH / 2, VW, VH / 2);

  const colW = Math.ceil(VW / RAYS);

  for (let i = 0; i < RAYS; i++) {
    const ang = startAng + stepAng * i;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    let hit = false;
    for (let depth = 0.05; depth < MAX_DEPTH; depth += 0.02) {
      const tx = player.x + ca * depth;
      const ty = player.y + sa * depth;
      if (tx < 0 || ty < 0 || tx >= gw || ty >= gh) break;
      const cell = grid[ty | 0][tx | 0];
      if (cell === 0) continue;
      // коррекция fish-eye
      const dist = depth * Math.cos(ang - player.angle);
      const d = Math.max(dist, 0.001);
      const colH = Math.min(VH / d, VH * 3);
      const y0 = (VH >> 1) - colH / 2;

      const tex = cell === 2 ? TEX_EXIT : TEX_WALL;
      // выбор столбца текстуры
      const fx = tx - Math.floor(tx);
      const fy = ty - Math.floor(ty);
      let texX;
      if (Math.min(fx, 1 - fx) < Math.min(fy, 1 - fy)) {
        texX = ca < 0 ? (fx * 64) | 0 : ((1 - fx) * 64) | 0;
      } else {
        texX = sa < 0 ? (fy * 64) | 0 : ((1 - fy) * 64) | 0;
      }
      texX = clamp(texX, 0, 63);

      // затемнение
      const shade = Math.max(0.25, 1 - d / MAX_DEPTH);

      drawTexturedColumn(i * colW, Math.max(0, y0), colW, colH, tex, texX, shade);
      zbuffer[i] = d;
      hit = true;
      break;
    }
    if (!hit) zbuffer[i] = MAX_DEPTH;
  }
}

// Рисуем одну колонку стены из текстуры
function drawTexturedColumn(x, y, w, h, tex, texX, shade) {
  // h может быть больше экрана: рисуем в offscreen полосу нужной высоты
  // и обрезаем через clip
  const srcTop = 0;
  const srcBottom = tex.size;
  // y0 может быть отрицательным — тогда обрезаем сверху
  let drawY = y;
  let drawH = h;
  let srcY0 = srcTop;
  let srcY1 = srcBottom;
  if (drawY < 0) {
    const cut = -drawY;
    srcY0 = srcTop + (cut / h) * (srcBottom - srcTop);
    drawH -= cut;
    drawY = 0;
  }
  if (drawY + drawH > VH) {
    const cut = drawY + drawH - VH;
    srcY1 = srcBottom - (cut / h) * (srcBottom - srcTop);
    drawH -= cut;
  }
  if (drawH <= 0) return;

  // Копируем столбец текстуры в маленький канвас 1×N и растягиваем
  const strip = getStrip(tex, texX);
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(strip, 0, srcY0, 1, Math.max(1, srcY1 - srcY0),
                x, drawY, w, drawH);
  // затемнение — накрываем полупрозрачным чёрным
  if (shade < 1) {
    ctx.fillStyle = "rgba(0,0,0," + (1 - shade) + ")";
    ctx.fillRect(x, drawY, w, drawH);
  }
  ctx.restore();
}

// Кэш: для каждой текстуры — массив canvas-полос 1×64 (по одному на texX)
const stripCache = new WeakMap();
function getStrip(tex, texX) {
  let arr = stripCache.get(tex);
  if (!arr) { arr = new Array(tex.size); stripCache.set(tex, arr); }
  if (arr[texX]) return arr[texX];
  const c = makeCanvas(1, tex.size);
  const g = c.getContext("2d");
  const img = g.createImageData(1, tex.size);
  for (let y = 0; y < tex.size; y++) {
    const si = (y * tex.size + texX) * 3;
    const di = y * 4;
    img.data[di] = tex.data[si];
    img.data[di + 1] = tex.data[si + 1];
    img.data[di + 2] = tex.data[si + 2];
    img.data[di + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  arr[texX] = c;
  return c;
}

// Спрайты
function renderSprites() {
  const list = [];
  for (const e of enemies) if (e.alive) list.push({ x: e.x, y: e.y, spr: SPR_ENEMY });
  for (const p of pickups) {
    list.push({ x: p.x, y: p.y, spr: p.kind === "medkit" ? SPR_MEDKIT : SPR_AMMO });
  }
  list.sort((a, b) => {
    const da = Math.hypot(a.x - player.x, a.y - player.y);
    const db = Math.hypot(b.x - player.x, b.y - player.y);
    return db - da;
  });

  for (const s of list) {
    const dx = s.x - player.x;
    const dy = s.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.3) continue;
    let ang = Math.atan2(dy, dx) - player.angle;
    ang = ((ang + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    if (Math.abs(ang) > HALF_FOV + 0.3) continue;
    const screenX = (0.5 + ang / FOV) * VW;
    const size = Math.min(VH / dist, VH * 2);
    const col = clamp(Math.floor(screenX / VW * RAYS), 0, RAYS - 1);
    if (dist > zbuffer[col]) continue;
    // вертикальное смещение — спрайт стоит на полу
    const y = VH / 2 + size / 4 - size / 2;
    ctx.drawImage(s.spr, screenX - size / 2, y, size, size);
  }
}

// ============================================================
// HUD
// ============================================================
function renderWeapon() {
  const spr = player.weapon === "pistol" ? SPR_PISTOL : SPR_SHOTGUN;
  const w = spr.width, h = spr.height;
  let cy;
  if (aiming) cy = VH - h / 2 - 30;
  else cy = VH - h / 2 + 90 + player.anim * 40;
  const cx = VW / 2;

  if (player.flash > 0) {
    ctx.save();
    ctx.globalAlpha = 0.5 * player.flash;
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgb(255,220,100)";
    // рисуем прямоугольник-вспышку под пистолетом
    ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
    ctx.restore();
  }
  ctx.drawImage(spr, cx - w / 2, cy - h / 2);
}

function renderCrosshair() {
  const cx = VW / 2, cy = VH / 2;
  const gap = aiming ? 6 : 10;
  const len = aiming ? 10 : 8;
  ctx.strokeStyle = aiming ? "#00ff50" : "#e6e6e6";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - gap - len, cy); ctx.lineTo(cx - gap, cy);
  ctx.moveTo(cx + gap, cy); ctx.lineTo(cx + gap + len, cy);
  ctx.moveTo(cx, cy - gap - len); ctx.lineTo(cx, cy - gap);
  ctx.moveTo(cx, cy + gap); ctx.lineTo(cx, cy + gap + len);
  ctx.stroke();
  ctx.fillStyle = aiming ? "#00ff50" : "#e6e6e6";
  ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, 7); ctx.fill();
}

function renderDamageIndicators() {
  const cx = VW / 2, cy = VH / 2;
  for (const ind of player.damageIndicators) {
    const alpha = Math.min(1, ind.t / DAMAGE_INDICATOR_LIFETIME) * 0.8;
    const rIn = Math.min(VW, VH) * 0.28;
    const rOut = Math.min(VW, VH) * 0.60;
    const spread = 0.45;
    const angUp = -Math.PI / 2 + ind.rel;
    ctx.beginPath();
    ctx.moveTo(cx + rIn * Math.cos(angUp - spread), cy + rIn * Math.sin(angUp - spread));
    ctx.lineTo(cx + rOut * Math.cos(angUp - spread / 2), cy + rOut * Math.sin(angUp - spread / 2));
    ctx.lineTo(cx + rOut * Math.cos(angUp + spread / 2), cy + rOut * Math.sin(angUp + spread / 2));
    ctx.lineTo(cx + rIn * Math.cos(angUp + spread), cy + rIn * Math.sin(angUp + spread));
    ctx.closePath();
    ctx.fillStyle = "rgba(255,30,30," + alpha + ")";
    ctx.fill();
  }
}

function renderLowHpWarning() {
  if (player.hp > 30 || player.hp <= 0) return;
  const intensity = (30 - player.hp) / 30;
  const pulse = 0.5 + 0.5 * Math.sin(menuTime * 6);
  const alpha = 0.35 * intensity * pulse;
  if (alpha <= 0.01) return;
  const border = 80;
  ctx.fillStyle = "rgba(200,0,0," + alpha + ")";
  ctx.fillRect(0, 0, VW, border);
  ctx.fillRect(0, VH - border, VW, border);
  ctx.fillRect(0, 0, border, VH);
  ctx.fillRect(VW - border, 0, border, VH);
}

function renderMinimap() {
  const s = 6, ox = 10, oy = 10;
  const gh = grid.length, gw = grid[0].length;
  for (let y = 0; y < gh; y++) {
    for (let x = 0; x < gw; x++) {
      const c = grid[y][x];
      if (!c) continue;
      ctx.fillStyle = c === 2 ? "#50dc78" : "#64647e";
      ctx.fillRect(ox + x * s, oy + y * s, s - 1, s - 1);
    }
  }
  for (const e of enemies) if (e.alive) {
    ctx.fillStyle = "#dc2828";
    ctx.beginPath(); ctx.arc(ox + e.x * s, oy + e.y * s, 3, 0, 7); ctx.fill();
  }
  for (const p of pickups) {
    ctx.fillStyle = p.kind === "medkit" ? "#ffffff" : "#dcc83c";
    ctx.beginPath(); ctx.arc(ox + p.x * s, oy + p.y * s, 2, 0, 7); ctx.fill();
  }
  ctx.fillStyle = "#3cb4ff";
  ctx.beginPath(); ctx.arc(ox + player.x * s, oy + player.y * s, 4, 0, 7); ctx.fill();
  ctx.strokeStyle = "#3cb4ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ox + player.x * s, oy + player.y * s);
  ctx.lineTo(ox + (player.x + Math.cos(player.angle) * 1.2) * s,
             oy + (player.y + Math.sin(player.angle) * 1.2) * s);
  ctx.stroke();
}

function renderHud() {
  // HP
  ctx.fillStyle = "#1e1e1e"; ctx.fillRect(20, VH - 60, 220, 30);
  const hpW = Math.max(0, Math.floor(220 * player.hp / 100));
  ctx.fillStyle = player.hp > 30 ? "#dc2828" : "#ff6428";
  ctx.fillRect(20, VH - 60, hpW, 30);
  ctx.font = "bold 20px Consolas, monospace";
  ctx.fillStyle = "#fff";
  ctx.fillText("HP: " + Math.max(0, player.hp | 0), 28, VH - 38);
  ctx.fillStyle = "#ffdc50";
  ctx.fillText("AMMO: " + player.ammo, VW - 180, VH - 38);
  ctx.fillStyle = "#c8c8ff";
  ctx.fillText("WEAPON: " + player.weapon.toUpperCase(), VW / 2 - 80, VH - 38);
  ctx.fillStyle = "#c8ffc8";
  ctx.fillText("SCORE: " + player.score, VW / 2 - 80, 35);
  ctx.fillStyle = "#c8c8c8";
  ctx.font = "14px Consolas, monospace";
  ctx.fillText("WASD | Мышь | ПКМ - прицел | ЛКМ - выстрел | Q - оружие | ESC - меню",
               10, VH - 8);
  // название уровня
  ctx.font = "bold 18px Consolas, monospace";
  ctx.fillStyle = "#dcdcf0";
  const t = "Уровень " + (levelIdx + 1) + ": " + LEVEL_NAMES[levelIdx];
  const tw = ctx.measureText(t).width;
  ctx.fillText(t, VW / 2 - tw / 2, 55);
}

// ============================================================
// МЕНЮ
// ============================================================
const stars = [];
for (let i = 0; i < 180; i++) {
  stars.push({
    x: Math.random() * VW,
    y: Math.random() * VH,
    r: Math.random() < 0.75 ? 1 : 2,
    speed: 8 + Math.random() * 37,
    alpha: 60 + Math.random() * 140,
    color: ["#c8dcff", "#ffe6c8", "#dcc8ff", "#ffffff"][(Math.random() * 4) | 0],
    phase: Math.random() * 6.28
  });
}

function drawMenuBg(dt) {
  // радиальный градиент
  const grad = ctx.createRadialGradient(VW / 2, VH / 2, 0, VW / 2, VH / 2, Math.max(VW, VH) / 2);
  grad.addColorStop(0, "#231f3c");
  grad.addColorStop(1, "#050508");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VW, VH);

  // звёзды
  for (const s of stars) {
    s.y += s.speed * dt;
    if (s.y > VH) { s.y = -2; s.x = Math.random() * VW; }
    const flick = 0.8 + 0.2 * Math.sin(menuTime * 3 + s.phase);
    ctx.globalAlpha = (s.alpha / 255) * flick;
    ctx.fillStyle = s.color;
    if (s.r === 1) {
      ctx.fillRect(s.x, s.y, 1, 1);
    } else {
      ctx.fillRect(s.x - 1, s.y - 1, 3, 3);
      ctx.fillRect(s.x - 3, s.y, 7, 1);
      ctx.fillRect(s.x, s.y - 3, 1, 7);
    }
  }
  ctx.globalAlpha = 1;
}

function drawTitle() {
  const text = "PYTHON DOOM";
  const cx = VW / 2;
  ctx.font = "bold 64px Consolas, monospace";
  const w = ctx.measureText(text).width;

  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillText(text, cx - w / 2 + 4, 130 + 4);
  ctx.fillStyle = "#dc2828";
  ctx.fillText(text, cx - w / 2, 130);
  const pulse = 0.5 + 0.5 * Math.sin(menuTime * 2);
  ctx.fillStyle = "rgba(255,180,60," + (0.35 + 0.65 * pulse) + ")";
  ctx.fillText(text, cx - w / 2, 130);
}

// Кнопки меню — описываются объектами
let menuButtons = [];
let menuSelected = 0;

function rebuildMenuButtons() {
  menuButtons = [];
  const bw = 320, bh = 56, gap = 14;
  const cx = VW / 2 - bw / 2;
  const startY = 200;
  const defs = [
    { text: "ИГРАТЬ", action: "play" },
    { text: "ВЫБОР УРОВНЯ", action: "levels" },
    { text: "НАСТРОЙКИ", action: "settings" },
    { text: "СБРОСИТЬ ПРОГРЕСС", action: "reset", danger: true },
    { text: "ВЫХОД", action: "quit" }
  ];
  defs.forEach((d, i) => {
    menuButtons.push({
      text: d.text,
      x: cx, y: startY + i * (bh + gap),
      w: bw, h: bh,
      action: d.action,
      danger: !!d.danger,
      appear: 0,
      hover: 0,
      delay: 0.15 + i * 0.08
    });
  });
}
rebuildMenuButtons();

function updateMenuButtons(dt) {
  for (const b of menuButtons) {
    if (menuTime >= b.delay && b.appear < 1) b.appear = Math.min(1, b.appear + dt * 4);
    const isHover = pointInRect(mouseX, mouseY, b);
    b.hover += ((isHover ? 1 : 0) - b.hover) * Math.min(1, dt * 12);
  }
}

function drawMenuButtons() {
  ctx.textAlign = "left";
  for (const b of menuButtons) {
    if (b.appear <= 0) continue;
    const appearOffset = (1 - b.appear) * 30;
    const lift = b.hover * 4;
    const x = b.x, y = b.y + appearOffset - lift;

    // тень
    ctx.fillStyle = "rgba(0,0,0," + (0.5 * b.appear) + ")";
    roundRect(x + 4, y + 6, b.w, b.h, 10); ctx.fill();

    // плашка
    let bg, border, fg, accent;
    if (b.danger) {
      const t = b.hover;
      bg = "rgb(" + Math.round(70 + t * 40) + "," + Math.round(25 + t * 10) + "," + Math.round(25 + t * 10) + ")";
      border = "rgb(" + Math.round(180 + t * 60) + "," + Math.round(60 + t * 20) + "," + Math.round(60 + t * 20) + ")";
      fg = "#ffe6e6";
      accent = "#ff6464";
    } else {
      const t = b.hover;
      bg = "rgb(" + Math.round(40 + t * 25) + "," + Math.round(50 + t * 30) + "," + Math.round(70 + t * 45) + ")";
      border = "rgb(" + Math.round(90 + t * 60) + "," + Math.round(120 + t * 60) + "," + Math.round(180 + t * 60) + ")";
      fg = "rgb(" + Math.round(220 + t * 35) + "," + Math.round(220 + t * 35) + ",255)";
      accent = "#50b4ff";
    }
    ctx.globalAlpha = b.appear;
    ctx.fillStyle = bg; roundRect(x, y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 2;
    roundRect(x, y, b.w, b.h, 10); ctx.stroke();
    // внутренняя обводка
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 1;
    roundRect(x + 3, y + 3, b.w - 6, b.h - 6, 8); ctx.stroke();

    // акцентная полоса
    if (b.hover > 0.05) {
      const barH = b.h * b.hover * 0.7;
      const barY = y + b.h / 2 - barH / 2;
      ctx.fillStyle = accent;
      roundRect(x + 6, barY, 2 + 4 * b.hover, barH, 2); ctx.fill();
    }

    // текст
    ctx.fillStyle = fg;
    ctx.font = "bold 24px Consolas, monospace";
    const tw = ctx.measureText(b.text).width;
    ctx.fillText(b.text, x + b.w / 2 - tw / 2, y + b.h / 2 + 8);
    ctx.globalAlpha = 1;
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function pointInRect(px, py, b) {
  const appearOffset = (1 - b.appear) * 30;
  const lift = b.hover * 4;
  const x = b.x, y = b.y + appearOffset - lift;
  return px >= x && px <= x + b.w && py >= y && py <= y + b.h;
}

// === Экран выбора уровня ===
let levelButtons = [];
let levelScroll = 0;
let levelScrollMax = 0;
let levelDragActive = false;
let levelDragStart = 0;
let levelDragScrollStart = 0;

function rebuildLevelButtons() {
  levelButtons = [];
  const cols = 5;
  const bw = 150, bh = 80, gapX = 15, gapY = 15;
  const gridW = cols * bw + (cols - 1) * gapX;
  const startX = VW / 2 - gridW / 2;
  const topMargin = 130;
  const bottomMargin = 90;
  const viewH = VH - topMargin - bottomMargin;
  const rows = Math.ceil(LEVELS_RAW.length / cols);
  const totalH = rows * bh + (rows - 1) * gapY;
  levelScrollMax = Math.max(0, totalH - viewH);
  levelScroll = Math.min(levelScroll, levelScrollMax);

  for (let i = 0; i < LEVELS_RAW.length; i++) {
    const col = i % cols, row = (i / cols) | 0;
    levelButtons.push({
      idx: i,
      x: startX + col * (bw + gapX),
      y: topMargin + row * (bh + gapY),
      w: bw, h: bh,
      enabled: i < unlocked,
      hover: 0
    });
  }
}

function drawLevelsScreen(dt) {
  drawMenuBg(dt);
  ctx.fillStyle = "#dcc850";
  ctx.font = "bold 48px Consolas, monospace";
  const t = "ВЫБОР УРОВНЯ";
  const tw = ctx.measureText(t).width;
  ctx.fillText(t, VW / 2 - tw / 2, 80);

  // clip области прокрутки
  const topMargin = 130;
  const bottomMargin = 90;
  const viewH = VH - topMargin - bottomMargin;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, topMargin - 5, VW, viewH + 10);
  ctx.clip();

  for (const b of levelButtons) {
    const vy = b.y - levelScroll;
    if (vy + b.h < topMargin - 10 || vy > VH - bottomMargin + 10) continue;

    const hovered = (mouseX >= b.x && mouseX <= b.x + b.w &&
                     mouseY >= vy && mouseY <= vy + b.h &&
                     mouseY >= topMargin - 5 && mouseY <= VH - bottomMargin + 5);
    b.hover += ((hovered ? 1 : 0) - b.hover) * Math.min(1, dt * 12);

    let bg, border, fg;
    if (!b.enabled) {
      bg = "#28282d"; border = "#3c3c41"; fg = "#6e6e6e";
    } else if (b.hover > 0.5) {
      bg = "#3c4660"; border = "#7eaaff"; fg = "#f0f0ff";
    } else {
      bg = "#28303c"; border = "#506478"; fg = "#dcdcff";
    }
    ctx.fillStyle = bg; roundRect(b.x, vy, b.w, b.h, 8); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 2;
    roundRect(b.x, vy, b.w, b.h, 8); ctx.stroke();

    ctx.fillStyle = fg;
    ctx.font = "bold 22px Consolas, monospace";
    const title = "УР. " + (b.idx + 1);
    const tW = ctx.measureText(title).width;
    ctx.fillText(title, b.x + b.w / 2 - tW / 2, vy + 38);

    ctx.font = "12px Consolas, monospace";
    ctx.fillStyle = b.enabled ? "#9c9cb4" : "#5a5a64";
    const subtitle = b.enabled ? LEVEL_NAMES[b.idx] : "заблокировано";
    const sW = ctx.measureText(subtitle).width;
    ctx.fillText(subtitle, b.x + b.w / 2 - sW / 2, vy + 62);
  }
  ctx.restore();

  // полоса прокрутки
  if (levelScrollMax > 0) {
    const rows = Math.ceil(LEVELS_RAW.length / 5);
    const totalH = rows * 80 + (rows - 1) * 15;
    const barH = Math.max(30, viewH * viewH / totalH);
    const barY = topMargin + (viewH - barH) * (levelScroll / levelScrollMax);
    ctx.fillStyle = "#3c3c46";
    roundRect(VW - 15, topMargin, 6, viewH, 3); ctx.fill();
    ctx.fillStyle = "#8cb4f0";
    roundRect(VW - 15, barY, 6, barH, 3); ctx.fill();
    ctx.fillStyle = "#8c8ca4";
    ctx.font = "14px Consolas, monospace";
    const hint = "колесо мыши / свайп для прокрутки";
    const hW = ctx.measureText(hint).width;
    ctx.fillText(hint, VW / 2 - hW / 2, VH - bottomMargin + 30);
  }

  // кнопка назад
  drawBackButton();
}

window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;

  if (e.key === "Escape") {
    if (state === GAME_STATE.PLAYING) {
      exitToMenu();
    } else if (state === GAME_STATE.LEVELS || state === GAME_STATE.SETTINGS) {
      state = GAME_STATE.MENU;
      menuTime = 0;
      rebuildMenuButtons();
    } else if (state === GAME_STATE.CONFIRM_RESET) {
      state = GAME_STATE.MENU;
      rebuildMenuButtons();
    }
  }
  if (e.key === "Enter") {
    if (state === GAME_STATE.CONFIRM_RESET) {
      unlocked = resetProgress();
      state = GAME_STATE.MENU;
      menuTime = 0;
      rebuildMenuButtons();
    } else if (state === GAME_STATE.PLAYING && (gameOver || win)) {
      if (win) advanceAfterWin();
      else exitToMenu();
    }
  }
  if (e.key === "r" && state === GAME_STATE.PLAYING && (gameOver || win)) {
    loadLevel(levelIdx);
  }
  if (e.key === "q" && state === GAME_STATE.PLAYING && !gameOver && !win) {
    player.weapon = player.weapon === "pistol" ? "shotgun" : "pistol";
  }
  // в игре блокируем скролл страницы
  if (state === GAME_STATE.PLAYING) e.preventDefault();
});

  keys[e.key.toLowerCase()] = false;
});

// ============================================================
// ТАЧ-УПРАВЛЕНИЕ
// ============================================================
const JOY_R = 70;         // радиус "стика"
const JOY_X = 100, JOY_Y = VH - 110;
const FIRE_BTN = { x: VW - 90, y: VH - 110, r: 50 };
const AIM_BTN  = { x: VW - 210, y: VH - 110, r: 40 };
const SWAP_BTN = { x: VW - 210, y: VH - 210, r: 40 };

function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

function onTouchStart(e) {
  ensureAudio();
  if (state !== GAME_STATE.PLAYING) {
    // для меню имитируем клик мышью
    const t = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    mouseX = (t.clientX - rect.left) / rect.width * VW;
    mouseY = (t.clientY - rect.top) / rect.height * VH;
    handleMenuClick(mouseX, mouseY);
    e.preventDefault();
    return;
  }
  for (const t of e.changedTouches) {
    const rect = canvas.getBoundingClientRect();
    const x = (t.clientX - rect.left) / rect.width * VW;
    const y = (t.clientY - rect.top) / rect.height * VH;
    // кнопка огня
    if (dist2(x, y, FIRE_BTN.x, FIRE_BTN.y) < FIRE_BTN.r * FIRE_BTN.r) {
      touch.fireHeld = true;
      if (!gameOver && !win) shoot();
      continue;
    }
    // кнопка прицела (удержание)
    if (dist2(x, y, AIM_BTN.x, AIM_BTN.y) < AIM_BTN.r * AIM_BTN.r) {
      aiming = true;
      continue;
    }
    // кнопка смены оружия
    if (dist2(x, y, SWAP_BTN.x, SWAP_BTN.y) < SWAP_BTN.r * SWAP_BTN.r) {
      if (!gameOver && !win) player.weapon = player.weapon === "pistol" ? "shotgun" : "pistol";
      continue;
    }
    // левая половина — джойстик движения
    if (x < VW / 2 && touch.moveTouchId === null) {
      touch.moveTouchId = t.identifier;
      touch.moveStartX = x; touch.moveStartY = y;
      touch.moveDX = 0; touch.moveDY = 0;
      continue;
    }
    // правая половина — поворот
    if (x >= VW / 2 && touch.lookTouchId === null) {
      touch.lookTouchId = t.identifier;
      touch.lookLastX = x;
    }
  }
  e.preventDefault();
}

function onTouchMove(e) {
  if (state !== GAME_STATE.PLAYING) return;
  for (const t of e.changedTouches) {
    const rect = canvas.getBoundingClientRect();
    const x = (t.clientX - rect.left) / rect.width * VW;
    const y = (t.clientY - rect.top) / rect.height * VH;
    if (t.identifier === touch.moveTouchId) {
      let dx = x - touch.moveStartX;
      let dy = y - touch.moveStartY;
      const m = Math.hypot(dx, dy);
      if (m > JOY_R) { dx = dx / m * JOY_R; dy = dy / m * JOY_R; }
      touch.moveDX = dx / JOY_R;
      touch.moveDY = dy / JOY_R;
    } else if (t.identifier === touch.lookTouchId) {
      const dx = x - touch.lookLastX;
      touch.lookLastX = x;
      player.angle += dx * 0.006;
    }
  }
  e.preventDefault();
}

function onTouchEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.moveTouchId) {
      touch.moveTouchId = null;
      touch.moveDX = 0; touch.moveDY = 0;
    }
    if (t.identifier === touch.lookTouchId) {
      touch.lookTouchId = null;
    }
    // если отпустили кнопки
    const rect = canvas.getBoundingClientRect();
    const x = (t.clientX - rect.left) / rect.width * VW;
    const y = (t.clientY - rect.top) / rect.height * VH;
    if (dist2(x, y, FIRE_BTN.x, FIRE_BTN.y) < FIRE_BTN.r * FIRE_BTN.r) touch.fireHeld = false;
    if (dist2(x, y, AIM_BTN.x, AIM_BTN.y) < AIM_BTN.r * AIM_BTN.r) aiming = false;
  }
  e.preventDefault();
}

canvas.addEventListener("touchstart", onTouchStart, { passive: false });
canvas.addEventListener("touchmove", onTouchMove, { passive: false });
canvas.addEventListener("touchend", onTouchEnd, { passive: false });
canvas.addEventListener("touchcancel", onTouchEnd, { passive: false });

// ============================================================
// КЛИКИ ПО МЕНЮ
// ============================================================
function handleMenuClick(mx, my) {
  if (state === GAME_STATE.MENU) {
    for (const b of menuButtons) {
      if (pointInRect(mx, my, b)) {
        doMenuAction(b.action);
        return;
      }
    }
  } else if (state === GAME_STATE.LEVELS) {
    // кнопка назад
    if (mx >= 30 && mx <= 210 && my >= VH - 70 && my <= VH - 25) {
      state = GAME_STATE.MENU;
      menuTime = 0;
      rebuildMenuButtons();
      return;
    }
    const topMargin = 130, bottomMargin = 90;
    if (my < topMargin - 5 || my > VH - bottomMargin + 5) return;
    for (const b of levelButtons) {
      const vy = b.y - levelScroll;
      if (mx >= b.x && mx <= b.x + b.w && my >= vy && my <= vy + b.h) {
        if (b.enabled) {
          levelIdx = b.idx;
          loadLevel(levelIdx);
          state = GAME_STATE.PLAYING;
          // запрос pointer lock
          if (!isTouchDevice) setTimeout(() => canvas.requestPointerLock(), 50);
        }
        return;
      }
    }
  } else if (state === GAME_STATE.SETTINGS) {
    if (mx >= 30 && mx <= 210 && my >= VH - 70 && my <= VH - 25) {
      state = GAME_STATE.MENU;
      menuTime = 0;
      rebuildMenuButtons();
    }
  } else if (state === GAME_STATE.CONFIRM_RESET) {
    const w = 600, h = 260;
    const x = (VW - w) / 2, y = (VH - h) / 2;
    const yesX = x + 40, noX = x + w - 260, by = y + h - 80, bw = 220, bh = 55;
    if (mx >= yesX && mx <= yesX + bw && my >= by && my <= by + bh) {
      unlocked = resetProgress();
      state = GAME_STATE.MENU;
      menuTime = 0;
      rebuildMenuButtons();
    } else if (mx >= noX && mx <= noX + bw && my >= by && my <= by + bh) {
      state = GAME_STATE.MENU;
      menuTime = 0;
      rebuildMenuButtons();
    }
  }
}

function doMenuAction(action) {
  if (action === "play") {
    levelIdx = 0;
    loadLevel(levelIdx);
    state = GAME_STATE.PLAYING;
    if (!isTouchDevice) setTimeout(() => canvas.requestPointerLock(), 50);
  } else if (action === "levels") {
    state = GAME_STATE.LEVELS;
    levelScroll = 0;
    rebuildLevelButtons();
  } else if (action === "settings") {
    state = GAME_STATE.SETTINGS;
  } else if (action === "reset") {
    state = GAME_STATE.CONFIRM_RESET;
  } else if (action === "quit") {
    // в браузере "выход" = вернуться на пустой экран
    document.body.innerHTML = "<div style='color:#fff;font-family:Consolas;padding:40px;font-size:20px'>Спасибо за игру!<br><br>Обновите страницу, чтобы вернуться.</div>";
  }
}

canvas.addEventListener("click", (e) => {
  if (state !== GAME_STATE.PLAYING) {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width * VW;
    const my = (e.clientY - rect.top) / rect.height * VH;
    handleMenuClick(mx, my);
  }
});

canvas.addEventListener("wheel", (e) => {
  if (state === GAME_STATE.LEVELS) {
    levelScroll = clamp(levelScroll + e.deltaY * 0.6, 0, levelScrollMax);
    e.preventDefault();
  }
}, { passive: false });

function exitToMenu() {
  document.exitPointerLock && document.exitPointerLock();
  aiming = false;
  touch.moveTouchId = null; touch.lookTouchId = null;
  touch.moveDX = 0; touch.moveDY = 0;
  state = GAME_STATE.MENU;
  menuTime = 0;
  rebuildMenuButtons();
}

function advanceAfterWin() {
  if (levelIdx + 1 >= LEVELS_RAW.length) {
    // игра пройдена — вернёмся в меню
    exitToMenu();
    return;
  }
  // обновим прогресс
  const newUnlocked = Math.min(levelIdx + 2, LEVELS_RAW.length);
  if (newUnlocked > unlocked) {
    unlocked = newUnlocked;
    saveProgress(unlocked);
  }
  levelIdx += 1;
  loadLevel(levelIdx);
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
function update(dt) {
  menuTime += dt;

  if (state === GAME_STATE.PLAYING) {
    if (!gameOver && !win) {
      // движение клавиатурой
      const sp = (aiming ? 1.5 : 3.0) * dt;
      let dx = 0, dy = 0;
      if (keys["w"] || keys["ц"]) { dx += Math.cos(player.angle) * sp; dy += Math.sin(player.angle) * sp; }
      if (keys["s"] || keys["ы"]) { dx -= Math.cos(player.angle) * sp; dy -= Math.sin(player.angle) * sp; }
      if (keys["a"] || keys["ф"]) {
        dx += Math.cos(player.angle - Math.PI / 2) * sp;
        dy += Math.sin(player.angle - Math.PI / 2) * sp;
      }
      if (keys["d"] || keys["в"]) {
        dx += Math.cos(player.angle + Math.PI / 2) * sp;
        dy += Math.sin(player.angle + Math.PI / 2) * sp;
      }
      // движение тачем
      if (touch.moveTouchId !== null) {
        const speed = (aiming ? 1.5 : 3.0) * dt * 1.2;
        const forward = -touch.moveDY;      // вверх = вперёд
        const strafe = touch.moveDX;
        dx += (Math.cos(player.angle) * forward - Math.sin(player.angle) * strafe) * speed;
        dy += (Math.sin(player.angle) * forward + Math.cos(player.angle) * strafe) * speed;
      }
      tryMove(dx, dy);

      // поворот мышью (pointer lock)
      if (document.pointerLockElement === canvas && mouseDX !== 0) {
        const sens = aiming ? 0.0012 : 0.0025;
        player.angle += mouseDX * sens;
        mouseDX = 0;
      } else {
        mouseDX = 0;
      }
      // нормализуем угол
      player.angle = ((player.angle + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;

      updateEnemies(dt);

      // подбор предметов
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        if (Math.hypot(p.x - player.x, p.y - player.y) < 0.5) {
          if (p.kind === "medkit") player.hp = Math.min(100, player.hp + 25);
          else player.ammo += 20;
          pickups.splice(i, 1);
          playPickup();
        }
      }
      // анимации
      player.anim = Math.max(0, player.anim - dt * 4);
      player.flash = Math.max(0, player.flash - dt * 8);
      updateDamageIndicators(dt);

      // выход
      if (exitPos && Math.hypot(exitPos.x - player.x, exitPos.y - player.y) < 0.6) {
        win = true;
      }
      if (player.hp <= 0) gameOver = true;
    } else {
      // если анимация ещё идёт — доводим
      player.anim = Math.max(0, player.anim - dt * 4);
      player.flash = Math.max(0, player.flash - dt * 8);
      updateDamageIndicators(dt);
    }
  } else if (state === GAME_STATE.MENU) {
    updateMenuButtons(dt);
  }
}

function render(dt) {
  if (state === GAME_STATE.MENU) {
    drawMenuBg(dt);
    drawTitle();
    // подзаголовок
    ctx.font = "20px Consolas, monospace";
    ctx.fillStyle = "#b4b4dc";
    const sub = "Raycasting FPS — JavaScript Edition";
    ctx.fillText(sub, VW / 2 - ctx.measureText(sub).width / 2, 175);
    // линии
    for (let i = 0; i < 3; i++) {
      const w = 300 - i * 40;
      ctx.strokeStyle = "rgba(200,180,120," + (0.25 - i * 0.06) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(VW / 2 - w / 2, 190 + i * 3);
      ctx.lineTo(VW / 2 + w / 2, 190 + i * 3);
      ctx.stroke();
    }
    drawMenuButtons();
    // подсказка
    ctx.fillStyle = "#8c8c9c";
    ctx.font = "14px Consolas, monospace";
    const hint = "Открыто уровней: " + unlocked + " / " + LEVELS_RAW.length + "   |   ESC — выход";
    ctx.fillText(hint, VW / 2 - ctx.measureText(hint).width / 2, VH - 35);
    ctx.fillStyle = "#64647c";
    ctx.fillText("v2.0-js", VW - 80, VH - 15);
  } else if (state === GAME_STATE.LEVELS) {
    drawLevelsScreen(dt);
  } else if (state === GAME_STATE.SETTINGS) {
    drawSettingsScreen(dt);
  } else if (state === GAME_STATE.CONFIRM_RESET) {
    // фон меню затем + диалог
    drawMenuBg(dt * 0.2);
    drawConfirmDialog(dt);
  } else if (state === GAME_STATE.PLAYING) {
    renderWalls();
    renderSprites();
    renderWeapon();
    renderCrosshair();
    renderDamageIndicators();
    renderLowHpWarning();
    renderMinimap();
    renderHud();

    // тач-кнопки
    if (isTouchDevice && touch.moveTouchId !== null || isTouchDevice) {
      drawTouchControls();
    }

    if (gameOver || win) {
      ctx.fillStyle = "rgba(0,0,0,0.72)";
      ctx.fillRect(0, 0, VW, VH);
      ctx.font = "bold 52px Consolas, monospace";
      if (gameOver) {
        ctx.fillStyle = "#ff3c3c";
        const m = "ВЫ ПОГИБЛИ";
        ctx.fillText(m, VW / 2 - ctx.measureText(m).width / 2, VH / 2 - 40);
      } else {
        ctx.fillStyle = "#3cff78";
        const m = "УРОВЕНЬ " + (levelIdx + 1) + " ПРОЙДЕН!";
        ctx.fillText(m, VW / 2 - ctx.measureText(m).width / 2, VH / 2 - 40);
      }
      ctx.font = "20px Consolas, monospace";
      ctx.fillStyle = "#dcdcdc";
      const sub = "R — заново   |   Enter — продолжить   |   ESC — меню";
      ctx.fillText(sub, VW / 2 - ctx.measureText(sub).width / 2, VH / 2 + 30);
    }
  }
}

function drawTouchControls() {
  // джойстик
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(JOY_X, JOY_Y, JOY_R, 0, 7); ctx.stroke();
  ctx.beginPath();
  ctx.arc(JOY_X + touch.moveDX * JOY_R, JOY_Y + touch.moveDY * JOY_R, 28, 0, 7);
  ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.beginPath();
  ctx.arc(JOY_X + touch.moveDX * JOY_R, JOY_Y + touch.moveDY * JOY_R, 28, 0, 7);
  ctx.fill();

  // кнопка огня
  ctx.fillStyle = "rgba(220,50,50,0.35)";
  ctx.beginPath(); ctx.arc(FIRE_BTN.x, FIRE_BTN.y, FIRE_BTN.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,150,150,0.7)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(FIRE_BTN.x, FIRE_BTN.y, FIRE_BTN.r, 0, 7); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px Consolas, monospace";
  ctx.fillText("ОГОНЬ", FIRE_BTN.x - 32, FIRE_BTN.y + 6);

  // кнопка прицела
  ctx.fillStyle = aiming ? "rgba(50,220,90,0.5)" : "rgba(90,180,90,0.3)";
  ctx.beginPath(); ctx.arc(AIM_BTN.x, AIM_BTN.y, AIM_BTN.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#b4ffb4"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(AIM_BTN.x, AIM_BTN.y, AIM_BTN.r, 0, 7); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 14px Consolas, monospace";
  ctx.fillText("ПРИЦЕЛ", AIM_BTN.x - 28, AIM_BTN.y + 5);

  // кнопка смены оружия
  ctx.fillStyle = "rgba(80,140,220,0.3)";
  ctx.beginPath(); ctx.arc(SWAP_BTN.x, SWAP_BTN.y, SWAP_BTN.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#8cb4ff"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(SWAP_BTN.x, SWAP_BTN.y, SWAP_BTN.r, 0, 7); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 14px Consolas, monospace";
  ctx.fillText("ОРУЖ.", SWAP_BTN.x - 26, SWAP_BTN.y + 5);
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000 || 0.016, 0.05);
  lastTime = now;
  update(dt);
  render(dt);
  requestAnimationFrame(loop);
}
lastTime = performance.now();
requestAnimationFrame(loop);

// При клике в игре снова захватываем pointer lock, если он потерян
canvas.addEventListener("mousedown", () => {
  if (state === GAME_STATE.PLAYING && document.pointerLockElement !== canvas && !isTouchDevice) {
    canvas.requestPointerLock();
  }
});

</script>
</body>
</html>
