const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });
function resizeCanvas() {
  const maxW = 1920, maxH = 1080;
  const w = Math.max(800, Math.min(window.innerWidth, maxW));
  const h = Math.max(500, Math.min(window.innerHeight, maxH));
  VW = w; VH = h;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

let audioCtx = null;
let masterVolume = 0.7;
let musicVolume = 0.5;
let musicSource = null;
let musicGainNode = null;
let currentTrackKey = null;
let currentTrackLoopTimer = null;
let isMusicPlaying = false;

(function loadVolumes() {
  try {
    const v = parseFloat(localStorage.getItem(STORAGE_VOLUME));
    if (!isNaN(v)) masterVolume = Math.max(0, Math.min(1, v));
    const mv = parseFloat(localStorage.getItem(STORAGE_MUSIC_VOLUME));
    if (!isNaN(mv)) musicVolume = Math.max(0, Math.min(1, mv));
  } catch (e) {}
})();
function saveVolumes() {
  try {
    localStorage.setItem(STORAGE_VOLUME, String(masterVolume));
    localStorage.setItem(STORAGE_MUSIC_VOLUME, String(musicVolume));
  } catch (e) {}
}
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
}
function playTone(type, freqStart, freqEnd, dur, vol) {
  if (!audioCtx || masterVolume <= 0) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), now + dur);
  gain.gain.setValueAtTime(vol * masterVolume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now); osc.stop(now + dur);
}
function playShot(kind) { playTone("square", kind === "shotgun" ? 180 : 320, 40, kind === "shotgun" ? 0.18 : 0.09, 0.14); }

// Синтез мелодии для каждого типа трека
function startSynthTrack(key) {
  const track = TRACKS[key];
  if (!track) return;
  const s = track.synth;
  const type = s.type;
  const baseFreq = s.base;
  const interval = s.tempo; // сек между нотами
  const wave = s.wave;

  const playNote = () => {
    if (!audioCtx || musicVolume <= 0) return;
    const now = audioCtx.currentTime;
    const dur = interval * 0.9;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = wave;

    // характер паттерна
    let freq = baseFreq;
    const pattern = Math.random();
    if (type === "ambient") {
      freq = baseFreq + (pattern < 0.5 ? 0 : 3);
    } else if (type === "march") {
      freq = baseFreq + (pattern < 0.3 ? 0 : (pattern < 0.6 ? 5 : 7));
    } else if (type === "dream") {
      freq = baseFreq + (pattern < 0.4 ? 0 : (pattern < 0.7 ? 4 : -3));
    } else if (type === "industrial") {
      freq = baseFreq + Math.floor(pattern * 12);
    } else if (type === "synthwave") {
      freq = baseFreq + (pattern < 0.3 ? 0 : (pattern < 0.7 ? 4 : 9));
    } else if (type === "techno") {
      freq = baseFreq + Math.floor(pattern * 6) * 2;
    }

    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.linearRampToValueAtTime(freq * 0.98, now + dur);

    gain.gain.setValueAtTime(0.06 * musicVolume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur);

    // редкий акцент (вторая нота)
    if (pattern < 0.3) {
      const now2 = audioCtx.currentTime;
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(freq * 2, now2);
      gain2.gain.setValueAtTime(0.03 * musicVolume, now2);
      gain2.gain.exponentialRampToValueAtTime(0.001, now2 + dur * 0.5);
      osc2.connect(gain2).connect(audioCtx.destination);
      osc2.start(now2); osc2.stop(now2 + dur * 0.5);
    }
  };

  playNote();
  currentTrackLoopTimer = setInterval(playNote, interval * 1000);
}

function stopMusic() {
  if (currentTrackLoopTimer) {
    clearInterval(currentTrackLoopTimer);
    currentTrackLoopTimer = null;
  }
  if (musicSource) {
    try { musicSource.pause(); musicSource.currentTime = 0; } catch (e) {}
    musicSource = null;
  }
  isMusicPlaying = false;
}

// Попытаться загрузить MP3 из файла, если не получилось — синтезировать
function playTrackByKey(key) {
  ensureAudio();
  stopMusic();
  currentTrackKey = key;
  isMusicPlaying = true;
  const track = TRACKS[key];
  if (!track) return;

  // Проверяем наличие MP3
  const audio = new Audio();
  audio.src = track.file;
  audio.loop = true;
  audio.volume = musicVolume * masterVolume;
  let failed = false;
  audio.onerror = () => {
    if (!failed) {
      failed = true;
      startSynthTrack(key);
    }
  };
  audio.play().then(() => {
    musicSource = audio;
  }).catch(() => {
    if (!failed) {
      failed = true;
      startSynthTrack(key);
    }
  });
}

function makeWallTexture(baseColor, seed) {
  const size = 64;
  const tex = new Uint8ClampedArray(size * size * 3);
  let s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const [br, bg, bb] = baseColor;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const brickY = y % 16;
      const offset = ((y / 16) | 0) % 2 ? 16 : 0;
      const brickX = (x + offset) % 32;
      let r, g, b;
      if (brickY < 2 || brickX < 2) {
        r = br * 0.5; g = bg * 0.5; b = bb * 0.5;
      } else {
        const n = (rnd() - 0.5) * 40;
        r = clamp(br + n, 0, 255);
        g = clamp(bg + n, 0, 255);
        b = clamp(bb + n, 0, 255);
      }
      const i = (y * size + x) * 3;
      tex[i] = r; tex[i + 1] = g; tex[i + 2] = b;
    }
  }
  return { data: tex, size };
}

  else if (isBossLevel) title = "★ БОСС: ПОВЕЛИТЕЛЬ БЕЗДНЫ ★";
  else if (isPage3) title = "СТР 3 — " + (levelIdx + 1) + ": " + PAGE3_NAMES[levelIdx];
  else if (isPage2) title = "СТР 2 — " + (levelIdx + 1) + ": " + PAGE2_NAMES[levelIdx];
  else title = "Уровень " + (levelIdx + 1) + ": " + PAGE1_NAMES[levelIdx];
  ctx.font = "bold 18px Consolas, monospace";
  ctx.fillStyle = isHellBossLevel ? "#ff4020" : isPage3 ? "#ff8040" : isPage2 ? "#d0a0ff" : "#dcdcf0";
  const tw = ctx.measureText(title).width;
  ctx.fillText(title, VW / 2 - tw / 2, 55);
}

      else {
        ctx.fillRect(s.x - 1, s.y - 1, 3, 3);
        ctx.fillRect(s.x - 3, s.y, 7, 1);
        ctx.fillRect(s.x, s.y - 3, 1, 7);
      }
    }
    ctx.globalAlpha = 1;
  }
}

function drawCursor(now) {
  if (state === GAME_STATE.PLAYING) return;
  const x = mouseX, y = mouseY;
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.005);
  const theme = (getSlot().cursorTheme) || "default";

  if (theme === "green") {
    const gap = 5, len = 10;
    ctx.strokeStyle = "rgba(0,0,0,0.65)"; ctx.lineWidth = 4;
    drawCrossLines(x, y, gap, len);
    ctx.strokeStyle = "#00ff50"; ctx.lineWidth = 2;
    drawCrossLines(x, y, gap, len);
    ctx.fillStyle = "#00ff50";
    ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill();
  } else if (theme === "gold") {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 22);
    glow.addColorStop(0, "rgba(255,215,0," + (0.4 + 0.2 * pulse) + ")");
    glow.addColorStop(1, "rgba(255,215,0,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.fill();
    const gap = 4, len = 10 + pulse * 2;
    ctx.strokeStyle = "rgba(0,0,0,0.75)"; ctx.lineWidth = 5;
    drawCrossLines(x, y, gap, len);
    ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 2;
    drawCrossLines(x, y, gap, len);
    ctx.fillStyle = "#fff5b0";
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill();
  } else if (theme === "neon") {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 20);
    glow.addColorStop(0, "rgba(80,200,255," + (0.4 + 0.25 * pulse) + ")");
    glow.addColorStop(1, "rgba(80,200,255,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();
    const gap = 6, len = 11;
    ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 5;
    drawCrossLines(x, y, gap, len);
    ctx.strokeStyle = "#50c8ff"; ctx.lineWidth = 2;
    drawCrossLines(x, y, gap, len);
    ctx.fillStyle = "#b0e8ff";
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill();
  } else if (theme === "skull") {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 22);
    glow.addColorStop(0, "rgba(255,20,20," + (0.4 + 0.3 * pulse) + ")");
    glow.addColorStop(1, "rgba(255,20,20,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.fill();
    // череп
    ctx.fillStyle = "#e6e0d0";
    ctx.beginPath(); ctx.arc(x, y - 2, 8, 0, 7); ctx.fill();
    ctx.fillRect(x - 8, y - 2, 16, 10);
    ctx.fillRect(x - 5, y + 6, 10, 5);
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(x - 3, y - 3, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 3, y - 3, 2, 0, 7); ctx.fill();
    ctx.fillRect(x - 2, y + 6, 4, 4);
  } else if (theme === "blood") {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 20);
    glow.addColorStop(0, "rgba(200,0,0," + (0.3 + 0.2 * pulse) + ")");
    glow.addColorStop(1, "rgba(200,0,0,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();
    const gap = 4, len = 10;
    ctx.strokeStyle = "#8a0000"; ctx.lineWidth = 4;
    drawCrossLines(x, y, gap, len);
    ctx.strokeStyle = "#ff2020"; ctx.lineWidth = 2;
    drawCrossLines(x, y, gap, len);
    // капли
    ctx.fillStyle = "#8a0000";
    for (let i = 0; i < 4; i++) {
      const a = (i * Math.PI / 2) + (now * 0.001);
      const dd = 18 + Math.sin(now * 0.01 + i) * 4;
      const cx = x + Math.cos(a) * dd;
      const cy = y + Math.sin(a) * dd;
      ctx.beginPath(); ctx.arc(cx, cy, 2, 0, 7); ctx.fill();
    }
  } else if (theme === "ice") {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 22);
    glow.addColorStop(0, "rgba(150,230,255," + (0.4 + 0.2 * pulse) + ")");
    glow.addColorStop(1, "rgba(150,230,255,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.fill();
    // снежинка
    ctx.strokeStyle = "#b0e8ff"; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + now * 0.001;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * 12, y + Math.sin(a) * 12);
      ctx.stroke();
      // маленькие веточки
      const bx = x + Math.cos(a) * 8;
      const by = y + Math.sin(a) * 8;
      for (let j = -1; j <= 1; j += 2) {
        const aa = a + j * 0.5;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(aa) * 4, by + Math.sin(aa) * 4);
        ctx.stroke();
      }
    }
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill();
  } else if (theme === "fire") {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 24);
    glow.addColorStop(0, "rgba(255,150,0," + (0.5 + 0.2 * pulse) + ")");
    glow.addColorStop(1, "rgba(255,150,0,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 24, 0, 7); ctx.fill();
    // пламя
    for (let i = 0; i < 6; i++) {
      const a = (i * Math.PI / 3) + now * 0.002;
      const r = 10 + Math.sin(now * 0.01 + i) * 3;
      const cx = x + Math.cos(a) * r * 0.6;
      const cy = y + Math.sin(a) * r * 0.6 - 5;
      ctx.fillStyle = "rgba(255," + (100 + i * 20) + ",0,0.7)";
      ctx.beginPath(); ctx.arc(cx, cy, 4 + Math.sin(now * 0.02 + i), 0, 7); ctx.fill();
    }
    ctx.fillStyle = "#ffcc00";
    ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
  } else if (theme === "void") {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 26);
    glow.addColorStop(0, "rgba(150,0,255," + (0.4 + 0.3 * pulse) + ")");
    glow.addColorStop(1, "rgba(150,0,255,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill();
    // глаз
    const blink = Math.sin(now * 0.002) > 0.95 ? 0.3 : 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, blink);
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#a040ff";
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-2, -2, 1.5, 0, 7); ctx.fill();
    ctx.restore();
  } else {
    // default — красный крест
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 18);
    glow.addColorStop(0, "rgba(255,60,60," + (0.25 + 0.15 * pulse) + ")");
    glow.addColorStop(1, "rgba(255,60,60,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 18, 0, 7); ctx.fill();
    const len = 9 + pulse * 2, gap = 4;
    ctx.strokeStyle = "rgba(0,0,0,0.65)"; ctx.lineWidth = 4;
    drawCrossLines(x, y, gap, len);
    ctx.strokeStyle = "rgba(255,240,240,0.98)"; ctx.lineWidth = 2;
    drawCrossLines(x, y, gap, len);
    ctx.fillStyle = "#ffdcdc";
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill();
  }
}
function drawCrossLines(x, y, gap, len) {
  ctx.beginPath();
  ctx.moveTo(x - gap - len, y); ctx.lineTo(x - gap, y);
  ctx.moveTo(x + gap, y); ctx.lineTo(x + gap + len, y);
  ctx.moveTo(x, y - gap - len); ctx.lineTo(x, y - gap);
  ctx.moveTo(x, y + gap); ctx.lineTo(x, y + gap + len);
  ctx.stroke();
}

let menuButtons = [];
function rebuildMenuButtons() {
  menuButtons = [];
  const bw = 320, bh = 44, gap = 8;
  const cx = VW / 2 - bw / 2;
  const startY = 170;
  const defs = [
    { text: "ИГРАТЬ", action: "play" },
    { text: "ВЫБОР УРОВНЯ", action: "levels" },
    { text: "ИГРОКИ И СЛОТЫ", action: "slots" },
    { text: "МАГАЗИН", action: "shop" },
    { text: "НАСТРОЙКИ", action: "settings" },
    { text: "ВЫХОД", action: "quit" }
  ];
  defs.forEach((d, i) => {
    menuButtons.push({
      text: d.text, x: cx, y: startY + i * (bh + gap),
      w: bw, h: bh, action: d.action,
      appear: 0, hover: 0, delay: 0.15 + i * 0.08
    });
  });
}
rebuildMenuButtons();
function updateMenuButtons(dt) {
  for (const b of menuButtons) {
    if (menuTime >= b.delay && b.appear < 1) b.appear = Math.min(1, b.appear + dt * 4);
    const isHover = pointInRect(mouseX, mouseY, b);
    b.hover += ((isHover ? 1 : 0) - b.hover) * Math.min(1, dt * 12);
  }
}
function drawMenuButtons() {
  for (const b of menuButtons) {
    if (b.appear <= 0) continue;
    const appearOffset = (1 - b.appear) * 30;
    const lift = b.hover * 4;
    const x = b.x, y = b.y + appearOffset - lift;
    ctx.fillStyle = "rgba(0,0,0," + (0.5 * b.appear) + ")";
    roundRect(x + 4, y + 6, b.w, b.h, 10); ctx.fill();
    const t = b.hover;
    const bg = "rgb(" + Math.round(40 + t * 25) + "," + Math.round(50 + t * 30) + "," + Math.round(70 + t * 45) + ")";
    const border = "rgb(" + Math.round(90 + t * 60) + "," + Math.round(120 + t * 60) + "," + Math.round(180 + t * 60) + ")";
    const fg = "rgb(" + Math.round(220 + t * 35) + "," + Math.round(220 + t * 35) + ",255)";
    ctx.globalAlpha = b.appear;
    ctx.fillStyle = bg; roundRect(x, y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 2; roundRect(x, y, b.w, b.h, 10); ctx.stroke();
    if (b.hover > 0.05) {
      const barH = b.h * b.hover * 0.7;
      const barY = y + b.h / 2 - barH / 2;
      ctx.fillStyle = "#50b4ff";
      roundRect(x + 6, barY, 2 + 4 * b.hover, barH, 2); ctx.fill();
    }
    ctx.fillStyle = fg;
    ctx.font = "bold 20px Consolas, monospace";
    const tw = ctx.measureText(b.text).width;

const JOY_R = 70;
const JOY_X = 100, JOY_Y = 110;
const FIRE_BTN = { x: 90, y: 110, r: 50 };
const AIM_BTN  = { x: 210, y: 110, r: 40 };
const SWAP_BTN = { x: 210, y: 210, r: 40 };
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function onTouchStart(e) {
  ensureAudio();
  if (state !== GAME_STATE.PLAYING) {
    const t = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    mouseX = (t.clientX - rect.left) / rect.width * VW;
    mouseY = (t.clientY - rect.top) / rect.height * VH;
    handleMenuClick(mouseX, mouseY);
    e.preventDefault(); return;
  }
  for (const t of e.changedTouches) {
    const rect = canvas.getBoundingClientRect();
    const x = (t.clientX - rect.left) / rect.width * VW;
    const y = (t.clientY - rect.top) / rect.height * VH;
    const fireX = VW - FIRE_BTN.x, fireY = VH - FIRE_BTN.y;
    const aimX = VW - AIM_BTN.x, aimY = VH - AIM_BTN.y;
    const swapX = VW - SWAP_BTN.x, swapY = VH - SWAP_BTN.y;
    if (dist2(x, y, fireX, fireY) < FIRE_BTN.r * FIRE_BTN.r) {
      touch.fireHeld = true;
      if (!gameOver && !win) shoot();
      continue;
    }
    if (dist2(x, y, aimX, aimY) < AIM_BTN.r * AIM_BTN.r) { aiming = true; continue; }
    if (dist2(x, y, swapX, swapY) < SWAP_BTN.r * SWAP_BTN.r) {
      if (!gameOver && !win) player.weapon = player.weapon === "pistol" ? "shotgun" : "pistol";
      continue;
    }
    if (x < VW / 2 && touch.moveTouchId === null) {
      touch.moveTouchId = t.identifier;
      touch.moveStartX = x; touch.moveStartY = y;
      touch.moveDX = 0; touch.moveDY = 0;
      continue;
    }
    if (x >= VW / 2 && touch.lookTouchId === null) {
      touch.lookTouchId = t.identifier;
      touch.lookLastX = x;
    }
  }
  e.preventDefault();
}
function onTouchMove(e) {
  if (state !== GAME_STATE.PLAYING) return;
  for (const t of e.changedTouches) {
    const rect = canvas.getBoundingClientRect();
    const x = (t.clientX - rect.left) / rect.width * VW;
    const y = (t.clientY - rect.top) / rect.height * VH;
    if (t.identifier === touch.moveTouchId) {
      let dx = x - touch.moveStartX, dy = y - touch.moveStartY;
      const m = Math.hypot(dx, dy);
      if (m > JOY_R) { dx = dx / m * JOY_R; dy = dy / m * JOY_R; }
      touch.moveDX = dx / JOY_R; touch.moveDY = dy / JOY_R;
    } else if (t.identifier === touch.lookTouchId) {
      const dx = x - touch.lookLastX;
      touch.lookLastX = x;
      player.angle += dx * 0.006;
    }
  }
  e.preventDefault();
}
function onTouchEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.moveTouchId) {
      touch.moveTouchId = null; touch.moveDX = 0; touch.moveDY = 0;
    }
    if (t.identifier === touch.lookTouchId) touch.lookTouchId = null;
    const rect = canvas.getBoundingClientRect();
    const x = (t.clientX - rect.left) / rect.width * VW;
    const y = (t.clientY - rect.top) / rect.height * VH;
    const fireX = VW - FIRE_BTN.x, fireY = VH - FIRE_BTN.y;
    const aimX = VW - AIM_BTN.x, aimY = VH - AIM_BTN.y;
    if (dist2(x, y, fireX, fireY) < FIRE_BTN.r * FIRE_BTN.r) touch.fireHeld = false;
    if (dist2(x, y, aimX, aimY) < AIM_BTN.r * AIM_BTN.r) aiming = false;
  }
  e.preventDefault();
}
canvas.addEventListener("touchstart", onTouchStart, { passive: false });
canvas.addEventListener("touchmove", onTouchMove, { passive: false });
canvas.addEventListener("touchend", onTouchEnd, { passive: false });
canvas.addEventListener("touchcancel", onTouchEnd, { passive: false });

  else { total = PAGE3_RAW.length + 1; rawLen = PAGE3_RAW.length; } // + hell boss
  const rows = Math.ceil(total / cols);
  const totalH = rows * bh + (rows - 1) * gapY;

    else if (b.hover > 0.5) { bg = "#3c4660"; border = "#7eaaff"; fg = "#f0f0ff"; }

    ctx.fillStyle = bg; roundRect(b.x, vy, b.w, b.h, 8); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 2;
    roundRect(b.x, vy, b.w, b.h, 8); ctx.stroke();
    ctx.fillStyle = fg;
    ctx.font = "bold 16px Consolas, monospace";
    let title;
    if (b.isBoss) title = "★ БОСС ★";
    else if (b.isHellBoss) title = "★★ АД-БОСС ★★";
    else title = "УР. " + (b.idx + 1);
    const tW = ctx.measureText(title).width;
    ctx.fillText(title, b.x + b.w / 2 - tW / 2, vy + 36);
    ctx.font = "11px Consolas, monospace";
    ctx.fillStyle = b.enabled ? (b.isHellBoss ? "#ffc090" : b.isBoss ? "#ff9090" : (b.page === 3 ? "#ffa060" : (b.page === 2 ? "#d0a0ff" : "#9c9cb4"))) : "#5a5a64";
    let subtitle;
    if (!b.enabled) subtitle = "заблокировано";
    else if (b.isBoss) subtitle = "финальный босс";
    else if (b.isHellBoss) subtitle = "владыка преисподней";
    else if (b.page === 3) subtitle = PAGE3_NAMES[b.idx];
    else if (b.page === 2) subtitle = PAGE2_NAMES[b.idx];
    else subtitle = PAGE1_NAMES[b.idx];
    const sW = ctx.measureText(subtitle).width;
    ctx.fillText(subtitle, b.x + b.w / 2 - sW / 2, vy + 60);
  }
  ctx.restore();
  if (levelScrollMax > 0) {
    const cols = 5;
    let total = currentPage === 1 ? PAGE1_RAW.length + 1 : currentPage === 2 ? PAGE2_RAW.length : PAGE3_RAW.length + 1;
    const rows = Math.ceil(total / cols);
    const totalH = rows * 78 + (rows - 1) * 15;
    const barH = Math.max(30, viewH * viewH / totalH);
    const barY = topMargin + (viewH - barH) * (levelScroll / levelScrollMax);
    ctx.fillStyle = "#3c3c46"; roundRect(VW - 15, topMargin, 6, viewH, 3); ctx.fill();
    ctx.fillStyle = "#8cb4f0"; roundRect(VW - 15, barY, 6, barH, 3); ctx.fill();
  }
  drawBackButton();
}
let backHover = 0;
function drawBackButton() {

let shopButtons = [];
let shopTab = "menu"; // menu | cursor | music
let shopTabsHit = [];

function rebuildShopButtons() {
  shopButtons = [];
  const slot = getSlot();

  if (shopTab === "menu" || shopTab === "cursor") {
    const themes = THEMES[shopTab];
    const keys = Object.keys(themes);
    const cardW = 200, cardH = 120, gap = 15;
    const cols = 5;
    const startX = (VW - (cols * cardW + (cols - 1) * gap)) / 2;
    const startY = 200;
    keys.forEach((k, i) => {
      const col = i % cols, row = (i / cols) | 0;
      shopButtons.push({
        kind: shopTab, key: k,
        x: startX + col * (cardW + gap),
        y: startY + row * (cardH + gap),
        w: cardW, h: cardH, hover: 0, appear: 1
      });
    });
  } else if (shopTab === "music") {
    const keys = Object.keys(TRACKS);
    const cardW = 300, cardH = 100, gap = 15;
    const cols = 3;
    const startX = (VW - (cols * cardW + (cols - 1) * gap)) / 2;
    const startY = 200;
    keys.forEach((k, i) => {
      const col = i % cols, row = (i / cols) | 0;
      shopButtons.push({
        kind: "music", key: k,
        x: startX + col * (cardW + gap),
        y: startY + row * (cardH + gap),
        w: cardW, h: cardH, hover: 0, appear: 1
      });
    });
  }
}

function drawShopScreen(dt) {
  drawMenuBg(dt);
  ctx.fillStyle = "#dcc850";
  ctx.font = "bold 40px Consolas, monospace";
  const t = "МАГАЗИН";
  const tw = ctx.measureText(t).width;
  ctx.fillText(t, VW / 2 - tw / 2, 50);

  const slot = getSlot();
  ctx.fillStyle = "#ffcc50";
  ctx.font = "bold 22px Consolas, monospace";
  const r = "Руны: " + slot.runes;
  ctx.fillText(r, VW / 2 - ctx.measureText(r).width / 2, 88);

  // 3 вкладки
  const tabW = 220, tabH = 40;
  const tx1 = VW / 2 - tabW * 1.5 - 20, tx2 = VW / 2 - tabW / 2, tx3 = VW / 2 + tabW / 2 + 20;
  const ty = 115;
  const drawShopTab = (tx, tab, label, color) => {
    const active = shopTab === tab;
    const hovered = mouseX >= tx && mouseX <= tx + tabW && mouseY >= ty && mouseY <= ty + tabH;
    const bg = active ? color + "40" : (hovered ? "#2c3640" : "#1e2430");
    const border = active ? color : "#506478";
    ctx.fillStyle = bg; roundRect(tx, ty, tabW, tabH, 8); ctx.fill();

    roundRect(tx, ty, tabW, tabH, 8); ctx.stroke();

    ctx.font = "bold 16px Consolas, monospace";
    ctx.fillText(label, tx + tabW / 2 - ctx.measureText(label).width / 2, ty + 27);
  };
  drawShopTab(tx1, "menu", "МЕНЮ", "#7eaaff");
  drawShopTab(tx2, "cursor", "КУРСОР", "#c060ff");
  drawShopTab(tx3, "music", "МУЗЫКА", "#ffcc50");

  for (const b of shopButtons) {
    const item = b.kind === "music" ? TRACKS[b.key] : THEMES[b.kind][b.key];
    let owned, equipped, canBuy;
    if (b.kind === "music") {
      owned = slot.ownedTracks.includes(b.key);
      equipped = (slot.musicMenu === b.key) || (slot.musicGame === b.key);
      canBuy = !owned && slot.runes >= item.price;
    } else {
      const ownedArr = b.kind === "menu" ? slot.ownedMenuThemes : slot.ownedCursorThemes;
      owned = ownedArr.includes(b.key);
      equipped = (b.kind === "menu" ? slot.menuTheme : slot.cursorTheme) === b.key;
      canBuy = !owned && slot.runes >= item.price;
    }
    const hovered = mouseX >= b.x && mouseX <= b.x + b.w && mouseY >= b.y && mouseY <= b.y + b.h;
    b.hover += ((hovered ? 1 : 0) - b.hover) * Math.min(1, dt * 12);
    const border = equipped ? "#3cdc78" : (owned ? "#8cb4f0" : (canBuy ? "#ffcc50" : "#6a3a3a"));
    const bg = equipped ? "#1a4028" : (owned ? "#1a2840" : (canBuy ? "#3c2e1a" : "#28201a"));
    ctx.fillStyle = bg; roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = equipped ? 3 : 2;
    roundRect(b.x, b.y, b.w, b.h, 10); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px Consolas, monospace";
    ctx.fillText(item.name, b.x + b.w / 2 - ctx.measureText(item.name).width / 2, b.y + 28);
    ctx.fillStyle = "#c8c8d0";
    ctx.font = "12px Consolas, monospace";
    ctx.fillText(item.desc, b.x + b.w / 2 - ctx.measureText(item.desc).width / 2, b.y + 50);
    let label, color;
    if (b.kind === "music" && owned) {
      const isMenu = slot.musicMenu === b.key;
      const isGame = slot.musicGame === b.key;
      if (isMenu && isGame) { label = "✔ ВЕЗДЕ"; color = "#3cdc78"; }
      else if (isMenu) { label = "В МЕНЮ (клик — в игру)"; color = "#3cdc78"; }
      else if (isGame) { label = "В ИГРЕ (клик — в меню)"; color = "#3cdc78"; }
      else { label = "ВЫБРАТЬ"; color = "#8cb4f0"; }
      // для музыки: клик — переключает меню/игру
      ctx.fillStyle = color;
      ctx.font = "bold 13px Consolas, monospace";
      ctx.fillText(label, b.x + b.w / 2 - ctx.measureText(label).width / 2, b.y + b.h - 20);
    } else if (equipped) { label = "✔ ВЫБРАНО"; color = "#3cdc78"; }
    else if (owned) { label = "ВЫБРАТЬ"; color = "#8cb4f0"; }
    else if (canBuy) { label = "КУПИТЬ — " + item.price + " рун"; color = "#ffcc50"; }
    else { label = "НУЖНО " + item.price + " рун"; color = "#a06060"; }
    if (b.kind !== "music" || !owned) {
      ctx.fillStyle = color;
      ctx.font = "bold 14px Consolas, monospace";
      ctx.fillText(label, b.x + b.w / 2 - ctx.measureText(label).width / 2, b.y + b.h - 20);
    }
  }
  drawBackButton();
}

// ============================================================
function handleMenuClick(mx, my) {
  if (state === GAME_STATE.MENU) {
    for (const b of menuButtons) if (pointInRect(mx, my, b)) { doMenuAction(b.action); return; }
  } else if (state === GAME_STATE.SLOTS) {
    for (const b of slotButtons) {
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
        if (b.idx >= 0) { activeSlot = b.idx; saveActiveSlot(); rebuildSlotButtons();
          // Обновить музыку меню
          playTrackByKey(getSlot().musicMenu || "default"); return; }
        if (b.action === "play") { state = GAME_STATE.MENU; menuTime = 0; rebuildMenuButtons(); return; }
        if (b.action === "rename") { renameSlotIdx = activeSlot; renameBuffer = slots[activeSlot].name; state = GAME_STATE.RENAME; return; }
        if (b.action === "reset") {
          confirmMessage = "Сбросить прогресс слота \"" + getSlot().name + "\"?\nВсе открытые уровни, руны и покупки будут потеряны.";
          confirmCallback = () => { const s = getSlot(); const n = s.name; slots[activeSlot] = defaultSlot(n); saveSlots(); state = GAME_STATE.SLOTS; rebuildSlotButtons(); };
          state = GAME_STATE.CONFIRM_RESET; return;
        }
        if (b.action === "delete") {
          confirmMessage = "Удалить слот \"" + getSlot().name + "\"?";
          confirmCallback = () => { slots[activeSlot] = defaultSlot("Игрок " + (activeSlot + 1)); saveSlots(); state = GAME_STATE.SLOTS; rebuildSlotButtons(); };
          state = GAME_STATE.CONFIRM_RESET; return;
        }
      }
    }
    if (mx >= 30 && mx <= 210 && my >= VH - 70 && my <= VH - 25) {
      state = GAME_STATE.MENU; menuTime = 0; rebuildMenuButtons();
    }
  } else if (state === GAME_STATE.RENAME) {
    const w = 600, h = 240; const x = (VW - w) / 2, y = (VH - h) / 2;
    const saveX = x + 30, saveY = y + h - 60, bw = 200, bh = 45;
    const cancelX = x + w - 230;
    if (mx >= saveX && mx <= saveX + bw && my >= saveY && my <= saveY + bh) {
      const name = (renameBuffer.trim() || ("Игрок " + (renameSlotIdx + 1))).slice(0, 20);
      slots[renameSlotIdx].name = name; saveSlots();
      state = GAME_STATE.SLOTS; rebuildSlotButtons();
    } else if (mx >= cancelX && mx <= cancelX + bw && my >= saveY && my <= saveY + bh) {
      state = GAME_STATE.SLOTS; rebuildSlotButtons();
    }
  } else if (state === GAME_STATE.LEVELS) {
    if (mx >= 30 && mx <= 210 && my >= VH - 70 && my <= VH - 25) {
      state = GAME_STATE.MENU; menuTime = 0; rebuildMenuButtons(); return;
    }
    const tabW = 220, tabH = 40;
    const tx1 = VW / 2 - tabW * 1.5 - 20, tx2 = VW / 2 - tabW / 2, tx3 = VW / 2 + tabW / 2 + 20;
    const ty = 80;
    const slot = getSlot();
    if (mx >= tx1 && mx <= tx1 + tabW && my >= ty && my <= ty + tabH) {
      currentPage = 1; levelScroll = 0; rebuildLevelButtons(); return;
    }
    if (mx >= tx2 && mx <= tx2 + tabW && my >= ty && my <= ty + tabH) {
      if (slot.bossDefeated) { currentPage = 2; levelScroll = 0; rebuildLevelButtons(); }
      return;
    }
    if (mx >= tx3 && mx <= tx3 + tabW && my >= ty && my <= ty + tabH) {
      if (slot.hellBossDefeated) { currentPage = 3; levelScroll = 0; rebuildLevelButtons(); }
      return;
    }
    const topMargin = 195, bottomMargin = 90;
    if (my < topMargin - 5 || my > VH - bottomMargin + 5) return;
    for (const b of levelButtons) {
      const vy = b.y - levelScroll;
      if (mx >= b.x && mx <= b.x + b.w && my >= vy && my <= vy + b.h) {
        if (b.enabled) {
          levelIdx = b.idx; loadLevel(levelIdx, b.page);
          state = GAME_STATE.PLAYING;
          if (!isTouchDevice) setTimeout(() => canvas.requestPointerLock(), 50);
        }
        return;
      }
    }
  } else if (state === GAME_STATE.SHOP) {
    const tabW = 220, tabH = 40;
    const tx1 = VW / 2 - tabW * 1.5 - 20, tx2 = VW / 2 - tabW / 2, tx3 = VW / 2 + tabW / 2 + 20;
    const ty = 115;
    if (mx >= tx1 && mx <= tx1 + tabW && my >= ty && my <= ty + tabH) { shopTab = "menu"; rebuildShopButtons(); return; }
    if (mx >= tx2 && mx <= tx2 + tabW && my >= ty && my <= ty + tabH) { shopTab = "cursor"; rebuildShopButtons(); return; }
    if (mx >= tx3 && mx <= tx3 + tabW && my >= ty && my <= ty + tabH) { shopTab = "music"; rebuildShopButtons(); return; }
    for (const b of shopButtons) {
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
        const item = b.kind === "music" ? TRACKS[b.key] : THEMES[b.kind][b.key];
        const slot = getSlot();
        if (b.kind === "music") {
          const owned = slot.ownedTracks.includes(b.key);
          if (owned) {
            // переключаем: если сейчас в меню — ставим в игру, и наоборот
            const isMenu = slot.musicMenu === b.key;
            const isGame = slot.musicGame === b.key;
            if (isMenu && isGame) { slot.musicMenu = "default"; slot.musicGame = "default"; }
            else if (isMenu) { slot.musicMenu = "default"; slot.musicGame = b.key; }
            else if (isGame) { slot.musicMenu = b.key; slot.musicGame = "default"; }
            else { slot.musicMenu = b.key; slot.musicGame = b.key; }
            saveSlots();
            playTrackByKey(slot.musicMenu || "default");
          } else if (slot.runes >= item.price) {
            slot.runes -= item.price;
            slot.ownedTracks.push(b.key);
            slot.musicMenu = b.key;
            slot.musicGame = b.key;
            saveSlots();
            playTrackByKey(b.key);
          }
        } else {
          const ownedArr = b.kind === "menu" ? slot.ownedMenuThemes : slot.ownedCursorThemes;
          if (ownedArr.includes(b.key)) {
            if (b.kind === "menu") slot.menuTheme = b.key;
            else slot.cursorTheme = b.key;
            saveSlots();
          } else if (slot.runes >= item.price) {
            slot.runes -= item.price;
            ownedArr.push(b.key);
            if (b.kind === "menu") slot.menuTheme = b.key;
            else slot.cursorTheme = b.key;
            saveSlots();
          }
        }
        return;
      }
    }
    if (mx >= 30 && mx <= 210 && my >= VH - 70 && my <= VH - 25) {
      state = GAME_STATE.MENU; menuTime = 0; rebuildMenuButtons();
    }
  } else if (state === GAME_STATE.SETTINGS) {
    if (mx >= 30 && mx <= 210 && my >= VH - 70 && my <= VH - 25) {
      state = GAME_STATE.MENU; menuTime = 0; rebuildMenuButtons();
    }
  } else if (state === GAME_STATE.CONFIRM_RESET) {
    const w = 600, h = 240; const x = (VW - w) / 2, y = (VH - h) / 2;
    const yesX = x + 40, noX = x + w - 260, by = y + h - 70, bw = 220, bh = 50;
    if (mx >= yesX && mx <= yesX + bw && my >= by && my <= by + bh) {
      if (confirmCallback) confirmCallback();
      confirmCallback = null;
    } else if (mx >= noX && mx <= noX + bw && my >= by && my <= by + bh) {
      confirmCallback = null;
      state = GAME_STATE.SLOTS; rebuildSlotButtons();
    }
  }
}

function doMenuAction(action) {
  if (action === "play") {
    const s = getSlot();
    if (s.hellBossDefeated && s.unlockedPage3 > 0) {
      currentPage = 3;
      levelIdx = Math.max(0, s.unlockedPage3 - 1);
      loadLevel(levelIdx, 3);
    } else if (s.bossDefeated && s.unlockedPage2 > 0) {
      currentPage = 2;
      levelIdx = Math.max(0, s.unlockedPage2 - 1);
      loadLevel(levelIdx, 2);
    } else {
      currentPage = 1;
      levelIdx = Math.max(0, Math.min(s.unlocked - 1, PAGE1_RAW.length));
      loadLevel(levelIdx, 1);
    }
    state = GAME_STATE.PLAYING;
    if (!isTouchDevice) setTimeout(() => canvas.requestPointerLock(), 50);
  } else if (action === "levels") {
    state = GAME_STATE.LEVELS; levelScroll = 0;
    currentPage = 1; rebuildLevelButtons();
  } else if (action === "slots") {
    state = GAME_STATE.SLOTS; rebuildSlotButtons();
  } else if (action === "shop") {
    state = GAME_STATE.SHOP; shopTab = "menu"; rebuildShopButtons();
  } else if (action === "settings") {
    settingsVolume = masterVolume;
    settingsMusicVolume = musicVolume;
    state = GAME_STATE.SETTINGS;
  } else if (action === "quit") {
    document.body.innerHTML = "<div style='color:#fff;font-family:Consolas;padding:40px;font-size:20px'>Спасибо за игру!<br><br>Обновите страницу, чтобы вернуться.</div>";
  }
}

function exitToMenu() {
  if (document.exitPointerLock) document.exitPointerLock();
  aiming = false;
  touch.moveTouchId = null; touch.lookTouchId = null;
  touch.moveDX = 0; touch.moveDY = 0;
  state = GAME_STATE.MENU;
  menuTime = 0;
  rebuildMenuButtons();
  // Переключить музыку на меню
  playTrackByKey(getSlot().musicMenu || "default");
}

function rewardRunesForLevel(page, idx, isBoss, isHellBoss) {
  const s = getSlot();
  if (isHellBoss) { s.runes += 500; return; }
  if (isBoss) { s.runes += 300; return; }
  if (page === 3) s.runes += 50;
  else if (page === 2) s.runes += 30;
  else s.runes += 15;
}

function advanceAfterWin() {
  const s = getSlot();
  if (isHellBossLevel) {
    if (!s.hellBossDefeated) {
      s.hellBossDefeated = true;
      rewardRunesForLevel(3, levelIdx, false, true);
    }
    saveSlots();
    exitToMenu();
    return;
  }
  if (isBossLevel) {
    if (!s.bossDefeated) {
      s.bossDefeated = true;
      s.unlockedPage2 = 1;
      rewardRunesForLevel(1, levelIdx, true, false);
    }
    saveSlots();
    exitToMenu();
    return;
  }
  if (isPage3) {
    rewardRunesForLevel(3, levelIdx, false, false);
    if (levelIdx + 1 === PAGE3_RAW.length) {
      // открываем адского босса
      s.unlockedPage3 = PAGE3_RAW.length + 1;
      saveSlots();
      levelIdx = PAGE3_RAW.length;
      loadLevel(levelIdx, 3);
      return;
    }
    if (s.unlockedPage3 < levelIdx + 2) s.unlockedPage3 = levelIdx + 2;
    saveSlots();
    levelIdx += 1;
    loadLevel(levelIdx, 3);
  } else if (isPage2) {
    rewardRunesForLevel(2, levelIdx, false, false);
    if (levelIdx + 1 >= PAGE2_RAW.length) {
      exitToMenu();
      return;
    }
    if (s.unlockedPage2 < levelIdx + 2) s.unlockedPage2 = levelIdx + 2;
    saveSlots();
    levelIdx += 1;
    loadLevel(levelIdx, 2);
  } else {
    rewardRunesForLevel(1, levelIdx, false, false);
    if (levelIdx + 1 > s.unlocked) {
      s.unlocked = levelIdx + 2;
      if (s.unlocked > PAGE1_RAW.length + 1) s.unlocked = PAGE1_RAW.length + 1;
    }
    saveSlots();
    if (levelIdx + 1 === PAGE1_RAW.length) {
      levelIdx = PAGE1_RAW.length;
      loadLevel(levelIdx, 1);
      return;
    }
    levelIdx += 1;
    loadLevel(levelIdx, 1);
  }
}

// ============================================================
// ЦИКЛ
// ============================================================
function update(dt) {
  menuTime += dt;
  if (state === GAME_STATE.PLAYING) {
    if (!gameOver && !win) {
      const sp = (aiming ? 1.5 : 3.0) * dt;
      let dx = 0, dy = 0;
      if (keys["w"] || keys["ц"]) { dx += Math.cos(player.angle) * sp; dy += Math.sin(player.angle) * sp; }
      if (keys["s"] || keys["ы"]) { dx -= Math.cos(player.angle) * sp; dy -= Math.sin(player.angle) * sp; }
      if (keys["a"] || keys["ф"]) {
        dx += Math.cos(player.angle - Math.PI / 2) * sp;
        dy += Math.sin(player.angle - Math.PI / 2) * sp;
      }
      if (keys["d"] || keys["в"]) {
        dx += Math.cos(player.angle + Math.PI / 2) * sp;
        dy += Math.sin(player.angle + Math.PI / 2) * sp;
      }
      if (touch.moveTouchId !== null) {
        const speed = (aiming ? 1.5 : 3.0) * dt * 1.2;
        const forward = -touch.moveDY;
        const strafe = touch.moveDX;
        dx += (Math.cos(player.angle) * forward - Math.sin(player.angle) * strafe) * speed;
        dy += (Math.sin(player.angle) * forward + Math.cos(player.angle) * strafe) * speed;
      }
      tryMove(dx, dy);
      if (document.pointerLockElement === canvas && mouseDX !== 0) {
        const sens = aiming ? 0.0012 : 0.0025;
        player.angle += mouseDX * sens;
        mouseDX = 0;
      } else mouseDX = 0;
      player.angle = ((player.angle + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
      updateEnemies(dt);
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        if (Math.hypot(p.x - player.x, p.y - player.y) < 0.5) {
          if (p.kind === "medkit") player.hp = Math.min(100, player.hp + 25);
          else player.ammo += 20;
          pickups.splice(i, 1);
          playPickup();
        }
      }
      player.anim = Math.max(0, player.anim - dt * 4);
      player.flash = Math.max(0, player.flash - dt * 8);
      updateDamageIndicators(dt);
      if (isBossLevel || isHellBossLevel) {
        if (boss && !boss.alive) win = true;
      } else {
        if (exitPos && Math.hypot(exitPos.x - player.x, exitPos.y - player.y) < 0.6) win = true;
      }
      if (player.hp <= 0) gameOver = true;
    } else {
      player.anim = Math.max(0, player.anim - dt * 4);
      player.flash = Math.max(0, player.flash - dt * 8);
      updateDamageIndicators(dt);
    }
  } else if (state === GAME_STATE.MENU) {
    updateMenuButtons(dt);
  }
}

function drawTouchControls() {
  const joyX = JOY_X, joyY = VH - JOY_Y;
  const fireX = VW - FIRE_BTN.x, fireY = VH - FIRE_BTN.y;
  const aimX = VW - AIM_BTN.x, aimY = VH - AIM_BTN.y;
  const swapX = VW - SWAP_BTN.x, swapY = VH - SWAP_BTN.y;
  ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(joyX, joyY, JOY_R, 0, 7); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.beginPath(); ctx.arc(joyX + touch.moveDX * JOY_R, joyY + touch.moveDY * JOY_R, 28, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(220,50,50,0.35)";
  ctx.beginPath(); ctx.arc(fireX, fireY, FIRE_BTN.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,150,150,0.7)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(fireX, fireY, FIRE_BTN.r, 0, 7); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 16px Consolas, monospace";
  ctx.fillText("ОГОНЬ", fireX - 30, fireY + 5);
  ctx.fillStyle = aiming ? "rgba(50,220,90,0.5)" : "rgba(90,180,90,0.3)";
  ctx.beginPath(); ctx.arc(aimX, aimY, AIM_BTN.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#b4ffb4"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(aimX, aimY, AIM_BTN.r, 0, 7); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 12px Consolas, monospace";
  ctx.fillText("ПРИЦЕЛ", aimX - 26, aimY + 4);
  ctx.fillStyle = "rgba(80,140,220,0.3)";
  ctx.beginPath(); ctx.arc(swapX, swapY, SWAP_BTN.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#8cb4ff"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(swapX, swapY, SWAP_BTN.r, 0, 7); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 12px Consolas, monospace";
  ctx.fillText("ОРУЖ.", swapX - 22, swapY + 4);
}

function render(dt) {
  if (state === GAME_STATE.MENU) {
    drawMenuBg(dt);
    drawTitle();
    ctx.font = "18px Consolas, monospace";
    ctx.fillStyle = "#b4b4dc";
    const act = getSlot();
    const sub = "Игрок: " + act.name + "  |  Руны: " + act.runes +
                "  |  Стр1: " + Math.max(0, act.unlocked - 1) + "/52" +
                "  |  Стр2: " + act.unlockedPage2 + "/31" +
                "  |  Стр3: " + act.unlockedPage3 + "/21";
    ctx.fillText(sub, VW / 2 - ctx.measureText(sub).width / 2, 158);
    drawMenuButtons();
    ctx.fillStyle = "#8c8c9c"; ctx.font = "14px Consolas, monospace";
    const hint = "ESC — выход   |   слот " + (activeSlot + 1) + " / " + SLOT_COUNT;
    ctx.fillText(hint, VW / 2 - ctx.measureText(hint).width / 2, VH - 35);
    ctx.fillStyle = "#64647c";
    ctx.fillText("v5.0-js", VW - 80, VH - 15);
  } else if (state === GAME_STATE.SLOTS) drawSlotScreen(dt);
  else if (state === GAME_STATE.RENAME) drawRenameScreen(dt);
  else if (state === GAME_STATE.LEVELS) drawLevelsScreen(dt);
  else if (state === GAME_STATE.SHOP) drawShopScreen(dt);
  else if (state === GAME_STATE.SETTINGS) drawSettingsScreen(dt);
  else if (state === GAME_STATE.CONFIRM_RESET) { drawMenuBg(dt * 0.2); drawConfirmDialog(dt); }
  else if (state === GAME_STATE.PLAYING) {
    renderWalls(); renderSprites(); renderWeapon();
    renderCrosshair(); renderDamageIndicators(); renderLowHpWarning();
    renderMinimap(); renderHud();
    if (isBossLevel || isHellBossLevel) renderBossBar();
    if (isTouchDevice) drawTouchControls();
    if (gameOver || win) {
      ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fillRect(0, 0, VW, VH);
      ctx.font = "bold 52px Consolas, monospace";
      if (gameOver) {
        ctx.fillStyle = "#ff3c3c";
        const m = isHellBossLevel ? "ВЛАДЫКА ПРЕИСПОДНЕЙ УБИЛ ВАС" : isBossLevel ? "БОСС ПОБЕДИЛ" : "ВЫ ПОГИБЛИ";
        ctx.fillText(m, VW / 2 - ctx.measureText(m).width / 2, VH / 2 - 40);
      } else if (isHellBossLevel) {
        ctx.fillStyle = "#ff8020";
        const m = "★★★ ВЛАДЫКА ПРЕИСПОДНЕЙ ПАЛ! ★★★";
        ctx.fillText(m, VW / 2 - ctx.measureText(m).width / 2, VH / 2 - 60);
        ctx.font = "22px Consolas, monospace";
        ctx.fillStyle = "#ffcc80";
        const s2 = "+500 рун! Вы прошли игру полностью.";
        ctx.fillText(s2, VW / 2 - ctx.measureText(s2).width / 2, VH / 2);
      } else if (isBossLevel) {
        ctx.fillStyle = "#ffcc00";
        const m = "★ ПОБЕДА! БОСС ПОВЕРЖЕН ★";
        ctx.fillText(m, VW / 2 - ctx.measureText(m).width / 2, VH / 2 - 60);
        ctx.font = "22px Consolas, monospace";
        ctx.fillStyle = "#ffe6a0";
        const s2 = "+300 рун! Страница 2 открыта.";
        ctx.fillText(s2, VW / 2 - ctx.measureText(s2).width / 2, VH / 2);
      } else {
        ctx.fillStyle = "#3cff78";
        const m = isPage3 ? "АД УР. " + (levelIdx + 1) + " ПРОЙДЕН!"
                : isPage2 ? "УР. " + (levelIdx + 1) + " СТР. 2 ПРОЙДЕН!"
                : "УРОВЕНЬ " + (levelIdx + 1) + " ПРОЙДЕН!";
        ctx.fillText(m, VW / 2 - ctx.measureText(m).width / 2, VH / 2 - 40);
      }
      ctx.font = "20px Consolas, monospace";
      ctx.fillStyle = "#dcdcdc";
      const sub = "R — заново   |   Enter — продолжить   |   ESC — меню";
      ctx.fillText(sub, VW / 2 - ctx.measureText(sub).width / 2, VH / 2 + 80);
    }
  }
  drawCursor(performance.now());
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000 || 0.016, 0.05);
  lastTime = now;
  update(dt);
  render(dt);
  requestAnimationFrame(loop);
}

// Запуск: подхватываем музыку меню для активного слота
setTimeout(() => {
  try { ensureAudio(); playTrackByKey(getSlot().musicMenu || "default"); } catch (e) {}
}, 500);

lastTime = performance.now();
requestAnimationFrame(loop);
</script>
